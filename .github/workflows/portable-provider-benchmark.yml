name: Portable Provider Benchmark

# Temporary bounded ADA-CI-PACK-001 pilot on the task branch only.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact pilot commit (must equal the workflow commit)
        required: true
        type: string
permissions:
  contents: read
jobs:
  ada-codec-pack-pilot:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/perf/ada-ci-pack-001'
    concurrency:
      group: oms-main-slot-3
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact dispatched source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$SOURCE_SHA" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install verified Alire 2.1.1
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/alire.zip" https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $RUNNER_TEMP/alire.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/alire.zip" -d "$RUNNER_TEMP/alire"
          test "$("$RUNNER_TEMP/alire/bin/alr" --version)" = 'alr 2.1.1'
          sha256sum "$RUNNER_TEMP/alire/bin/alr"
          echo "$RUNNER_TEMP/alire/bin" >> "$GITHUB_PATH"
      - name: Execute one four-worker benchmark with full prerequisite guard
        run: python3 scripts/ada_ci_pack/run.py --pack a --workers 4 --expected-sha "$GITHUB_SHA" --scratch "$RUNNER_TEMP/ada-codec-pack-a"
      - name: Preserve pilot measurements and every worker exit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ada-ci-pack-001-pilot
          path: |
            ${{ runner.temp }}/ada-codec-pack-a/*.json
            ${{ runner.temp }}/ada-codec-pack-a/*.jsonl
            ${{ runner.temp }}/ada-codec-pack-a/*.log
            ${{ runner.temp }}/ada-codec-pack-a/*/completion.json
            ${{ runner.temp }}/ada-codec-pack-a/*/step-*
            ${{ runner.temp }}/ada-codec-pack-a/*/alr.jsonl
          if-no-files-found: error
      - name: Preserve ada-json-guard original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task087a-ada-json-guard
          path: |
            ${{ runner.temp }}/ada-codec-pack-a/seed/task087a-qualification/*.log
            ${{ runner.temp }}/ada-codec-pack-a/seed/task087a-qualification/qualified-alire.lock
          if-no-files-found: error
      - name: Preserve ada-generated-codec original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task087b-generated-codec
          path: |
            ${{ runner.temp }}/ada-codec-pack-a/ada-generated-codec/task087b-codec/*.log
            ${{ runner.temp }}/ada-codec-pack-a/ada-generated-codec/task087b-codec/qualified-alire.lock
            ${{ runner.temp }}/ada-codec-pack-a/ada-generated-codec/task087b-codec/**/alire.lock
            ${{ runner.temp }}/ada-codec-pack-a/ada-generated-codec/task088-choice/*.log
            ${{ runner.temp }}/ada-codec-pack-a/ada-generated-codec/task088-choice/source-hashes.txt
            ${{ runner.temp }}/ada-codec-pack-a/ada-generated-codec/task088-choice/**/alire.lock
          if-no-files-found: error
      - name: Preserve ada-repeated-temporal-codec original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task094-ada-repeated-temporal-codec
          path: |
            ${{ runner.temp }}/ada-codec-pack-a/ada-repeated-temporal-codec/task094/**
            ${{ runner.temp }}/ada-codec-pack-a/ada-repeated-temporal-codec/task094-composition/**
            ${{ runner.temp }}/ada-codec-pack-a/ada-repeated-temporal-codec/task094-combined/**
          if-no-files-found: error
      - name: Preserve ada-datetime-codec original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task090-ada-datetime-codec
          path: |
            ${{ runner.temp }}/ada-codec-pack-a/ada-datetime-codec/task090/*.log
            ${{ runner.temp }}/ada-codec-pack-a/ada-datetime-codec/task090/*.lock
            ${{ runner.temp }}/ada-codec-pack-a/ada-datetime-codec/task090/*.sha256
            ${{ runner.temp }}/ada-codec-pack-a/ada-datetime-codec/task090/*.exit
            ${{ runner.temp }}/ada-codec-pack-a/ada-datetime-codec/task090/*.command.json
            ${{ runner.temp }}/ada-codec-pack-a/ada-datetime-codec/task090/*-corpus.txt
            ${{ runner.temp }}/ada-codec-pack-a/ada-datetime-codec/task090r/*.log
            ${{ runner.temp }}/ada-codec-pack-a/ada-datetime-codec/task090r/*.lock
            ${{ runner.temp }}/ada-codec-pack-a/ada-datetime-codec/task090r/*.sha256
            ${{ runner.temp }}/ada-codec-pack-a/ada-datetime-codec/task090r/*.exit
            ${{ runner.temp }}/ada-codec-pack-a/ada-datetime-codec/task090r/*.command.json
          if-no-files-found: error
      - name: Preserve ada-hexbinary-codec original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task093-ada-hexbinary-codec
          path: |
            ${{ runner.temp }}/ada-codec-pack-a/ada-hexbinary-codec/task093-c4-*/**
            ${{ runner.temp }}/ada-codec-pack-a/ada-hexbinary-codec/task093-hexbinary/**
            ${{ runner.temp }}/ada-codec-pack-a/ada-hexbinary-codec/task093-qualified/**
            ${{ runner.temp }}/ada-codec-pack-a/ada-hexbinary-codec/task093-combined/**
          if-no-files-found: error
