name: OMS Trusted PR Signal
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions: {}
jobs:
  signal:
    concurrency:
      group: ${{ format('oms-pr-{0}-{1}-{2}-oms-trusted-pr-signal.yml-signal', github.workflow, github.run_id, github.run_attempt) }}
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Authenticated PR lifecycle signal only
        run: printf '%s\n' 'PR signal complete; authorization is performed separately.'
