name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Task 033 ships Ada regressions that only have force when a real GNAT
      # toolchain is present. The Rust tests skip themselves when `gnatmake`
      # is missing, which is right for developer machines but would let CI go
      # green without ever checking the generated Ada. Installing GNAT here,
      # and gating on it below, makes that skip impossible on the runner.
      - name: Install GNAT
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat
      # Hard gate: no `|| true`. If GNAT is absent or broken, CI fails here
      # rather than silently degrading the Ada regressions into no-ops. The
      # version is printed so the log records which toolchain ran the tests.
      - name: Verify GNAT availability
        run: |
          command -v gnatmake
          gnatmake --version
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The four GNAT-backed Task 033 regressions are named explicitly so the
      # log proves each one executed. `require_one_test` fails the step if a
      # filter matches nothing, since a passing run of zero tests is exactly
      # the false green this workflow change exists to prevent.
      - name: Ada regressions (GNAT-backed, must execute)
        run: |
          set -euo pipefail
          require_one_test() {
            name="$1"
            shift
            output="$("$@" -- --exact --nocapture 2>&1)"
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -qE "^test ${name} \.\.\. ok$"
            printf '%s\n' "$output" | grep -qE '^test result: ok\. 1 passed'
          }
          require_one_test tests::constrained_floats_enforce_predicates_under_gnat \
            cargo test -p ams-gra-oms-backend-ada --lib \
            tests::constrained_floats_enforce_predicates_under_gnat
          require_one_test tests::constrained_floats_reject_public_bypasses_under_gnat \
            cargo test -p ams-gra-oms-backend-ada --lib \
            tests::constrained_floats_reject_public_bypasses_under_gnat
          require_one_test task033_selected_ada_float_predicates_hold_under_gnat \
            cargo test -p ams-gra-codegen-oms --test service_generate \
            task033_selected_ada_float_predicates_hold_under_gnat
          require_one_test task033_selected_ada_float_rejects_public_bypasses \
            cargo test -p ams-gra-codegen-oms --test service_generate \
            task033_selected_ada_float_rejects_public_bypasses
          # Corrective cleanup: the shared backend name preflight must not just
          # reject unsafe names, it must still let a safe control schema
          # produce Ada that GNAT actually accepts.
          require_one_test tests::preflight_control_renders_and_compiles \
            cargo test -p ams-gra-oms-backend-ada --lib \
            tests::preflight_control_renders_and_compiles
          # Task 040 corrective: repeated storage of validated carriers. These
          # are the probes that actually execute container operations, so a run
          # that skipped them would restate the exact false green that let the
          # vector-growth regression reach review. Zero matched tests is a
          # failure here for the same reason.
          require_one_test repeated_carrier_storage_is_usable_under_gnat \
            cargo test -p ams-gra-oms-backend-ada \
            --test repeated_carrier_storage \
            repeated_carrier_storage_is_usable_under_gnat
          require_one_test repeated_storage_never_declares_a_live_carrier_for_spare_capacity \
            cargo test -p ams-gra-oms-backend-ada \
            --test repeated_carrier_storage \
            repeated_storage_never_declares_a_live_carrier_for_spare_capacity
          require_one_test task040_selected_ada_repeated_field_is_constructible \
            cargo test -p ams-gra-codegen-oms --test service_generate \
            task040_selected_ada_repeated_field_is_constructible
          # Task 040 corrective, pass two. The bounded-occupancy controls live
          # inside the two repeated-storage probes above, which already run
          # here. These are the new focused regressions the second pass adds,
          # named explicitly for the same reason: a phantom callable or a
          # renamed sequence operation is a silent-acceptance failure, so a run
          # that matched zero tests must fail rather than report green.
          require_one_test tests::emitted_sequence_operations_are_exactly_the_shared_definition \
            cargo test -p ams-gra-oms-backend-ada --lib \
            tests::emitted_sequence_operations_are_exactly_the_shared_definition
          require_one_test backend_names::tests::a_non_emitted_abstract_record_reserves_no_sequence_callable \
            cargo test -p ams-gra-oms-codegen-core --lib \
            backend_names::tests::a_non_emitted_abstract_record_reserves_no_sequence_callable
          require_one_test backend_names::tests::an_inherited_unbounded_member_attributes_callables_to_the_descendant \
            cargo test -p ams-gra-oms-codegen-core --lib \
            backend_names::tests::an_inherited_unbounded_member_attributes_callables_to_the_descendant
          require_one_test backend_names::tests::bounded_shapes_reserve_exactly_the_operations_they_emit \
            cargo test -p ams-gra-oms-codegen-core --lib \
            backend_names::tests::bounded_shapes_reserve_exactly_the_operations_they_emit
          require_one_test backend_names::tests::an_emitted_sequence_still_collides_with_a_conflicting_type_name \
            cargo test -p ams-gra-oms-codegen-core --lib \
            backend_names::tests::an_emitted_sequence_still_collides_with_a_conflicting_type_name
          # The ORIGINAL Task 040 scalar/optional lifecycle controls must keep
          # passing alongside the corrected repeated paths.
          require_one_test a_default_declared_carrier_cannot_silently_hold_invalid_text_under_gnat \
            cargo test -p ams-gra-oms-backend-ada --test carrier_lifecycle \
            a_default_declared_carrier_cannot_silently_hold_invalid_text_under_gnat
          require_one_test legitimate_construction_paths_still_work_under_gnat \
            cargo test -p ams-gra-oms-backend-ada --test carrier_lifecycle \
            legitimate_construction_paths_still_work_under_gnat
          # Task 046: require the generated GNAT direct dateTime parser probe.
          require_one_test direct_date_time_and_named_zulu_share_the_gnat_parser \
            cargo test -p ams-gra-oms-backend-ada --test direct_datetime \
            direct_date_time_and_named_zulu_share_the_gnat_parser
          # Task 041: the whitespace-visible family. These are the probes that
          # actually EXECUTE the two normalization modes, so a run that skipped
          # them could report green while a collapse carrier stored the wrong
          # value. The Ada one additionally runs under
          # `Assertion_Policy (Ignore)`, and exercises null and non-1-based
          # input slices plus every sequence shape. Zero matched tests is a
          # failure here for the same reason as above.
          require_one_test generated_whitespace_visible_validators_match_the_shared_corpora_under_both_policies \
            cargo test -p ams-gra-oms-backend-ada \
            --test whitespace_visible \
            generated_whitespace_visible_validators_match_the_shared_corpora_under_both_policies
          require_one_test task041_selected_ada_client_exercises_the_sequences_under_gnat \
            cargo test -p ams-gra-codegen-oms --test service_generate \
            task041_selected_ada_client_exercises_the_sequences_under_gnat
          # Task 042: the NATO special-words carrier. These EXECUTE the shared
          # corpus, the 256-position alphabet sweep, and null / non-1-based /
          # Positive'Last-ending slices under both assertion policies, plus
          # the default-construction rejection and the selected client. Zero
          # matched tests is a failure for the same reason as above.
          require_one_test generated_nato_special_words_validator_matches_the_shared_corpus_under_both_policies \
            cargo test -p ams-gra-oms-backend-ada \
            --test nato_special_words \
            generated_nato_special_words_validator_matches_the_shared_corpus_under_both_policies
          require_one_test a_default_declared_nato_carrier_is_rejected_under_both_policies \
            cargo test -p ams-gra-oms-backend-ada \
            --test nato_special_words \
            a_default_declared_nato_carrier_is_rejected_under_both_policies
          require_one_test task042_selected_ada_client_constructs_and_reads_under_gnat \
            cargo test -p ams-gra-codegen-oms --test service_generate \
            task042_selected_ada_client_constructs_and_reads_under_gnat
          # Task 044: require both the digit-leading and reserved-only Ada
          # selected clients to compile and run, not merely match zero tests.
          require_one_test task044_generated_selected_models_compile_and_use_every_variant \
            cargo test -p ams-gra-codegen-oms --test enum_remapping \
            task044_generated_selected_models_compile_and_use_every_variant
          require_one_test task044_ada_reserved_only_selection_compiles_under_gnat \
            cargo test -p ams-gra-codegen-oms --test enum_remapping \
            task044_ada_reserved_only_selection_compiles_under_gnat
          # Task 047: the generated Ada service API wrapper must compile under
          # GNAT as a body-less spec (-gnatwe), and a consumer must use its
          # Payload subtypes as the generated model type. Zero matched tests
          # is a failure here, so the wrapper can never pass by skipping.
          require_one_test task047_ada_wrapper_compiles_under_gnat_and_is_consumable \
            cargo test -p ams-gra-codegen-oms --test service_api \
            task047_ada_wrapper_compiles_under_gnat_and_is_consumable
          # Task 048: the Ada publish/subscribe facade must stay a body-less
          # spec under GNAT, round-trip through fake hooks, and reject the
          # wrong operation / payload / handler at compile time. Zero matched
          # tests is a failure, so the facade can never pass by skipping.
          require_one_test task048_ada_facade_round_trips_through_fake_hooks \
            cargo test -p ams-gra-codegen-oms --test service_facade \
            task048_ada_facade_round_trips_through_fake_hooks
      # Task 049: the generated Rust facade must drive the Rust LA-CAL runtime
      # through the pinned sleet-client to a mock OWP peer and back into a
      # typed MSG callback. Each gate must match and pass exactly one test, so
      # a filter that matches nothing can never count as success.
      - name: Rust LA-CAL runtime (generated facade -> mock OWP, must execute)
        run: |
          set -euo pipefail
          require_one_test() {
            name="$1"
            shift
            output="$("$@" -- --exact --nocapture 2>&1)"
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -qE "^test ${name} \.\.\. ok$"
            printf '%s\n' "$output" | grep -qE '^test result: ok\. 1 passed'
          }
          for test in \
            task049_generated_facade_round_trips_through_mock_owp \
            task049_same_payload_different_message_differs_on_the_wire \
            task049_subscription_group_is_on_the_wire_or_absent \
            task049_oam_namespace_uses_bare_local_names; do
            require_one_test "$test" \
              cargo test -p ams-gra-oms-runtime-rust-facade-tests --test mock_owp "$test"
          done
          # PR #50 corrective: receive must keep progressing while the command
          # side is busy. The worker-level test holds the bounded queue at
          # capacity and fails under a commands-first biased select; the
          # facade-level test proves MSG/-ERR delivery under generated-publish
          # load, then clean unsubscribe/close/no worker thread.
          require_one_test worker::fairness_tests::worker_receives_while_command_queue_is_continuously_ready \
            cargo test -p ams-gra-oms-runtime-rust --lib \
            worker::fairness_tests::worker_receives_while_command_queue_is_continuously_ready
          require_one_test task049_receive_progresses_under_sustained_publish_load \
            cargo test -p ams-gra-oms-runtime-rust-facade-tests --test runtime_fairness \
            task049_receive_progresses_under_sustained_publish_load
      # Task 050: the GENERATED OMS JSON codec (service-generate --with-codec)
      # for the synthetic OAM fixture, plus the codec readiness controls. Each
      # gate must match and pass exactly one test.
      - name: Generated Rust OMS JSON codec (must execute)
        run: |
          set -euo pipefail
          require_one_test() {
            name="$1"
            shift
            output="$("$@" -- --exact --nocapture 2>&1)"
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -qE "^test ${name} \.\.\. ok$"
            printf '%s\n' "$output" | grep -qE '^test result: ok\. 1 passed'
          }
          for test in \
            task050_generated_codec_round_trips_every_construct \
            task050_strict_negative_decode_corpus \
            task050_enum_codec_uses_exact_wire_values \
            task050_choice_codec_selects_exactly_one_member \
            task050_abstract_value_codec_uses_type_member \
            task050_float_codec_uses_oms_special_strings \
            task050_record_repetition_and_optional_semantics; do
            require_one_test "$test" \
              cargo test -p ams-gra-oms-runtime-rust-facade-tests --test generated_codec "$test"
          done
          require_one_test task050_generated_codec_round_trips_through_mock_owp \
            cargo test -p ams-gra-oms-runtime-rust-facade-tests --test generated_codec_mock_owp \
            task050_generated_codec_round_trips_through_mock_owp
          # Task 051 replaced task050_non_oam_payload_fails_codec_preflight with
          # task051_qualified_non_oam_payload_is_codec_ready (below): a
          # qualified non-OAM payload is now codec READY. Task 052 replaced
          # task050_selected_binary_is_model_ready_but_codec_not_ready with
          # task052_selected_hex_binary_is_model_and_codec_ready (Task 052 step).
          for test in \
            task050_oam_codec_service_is_ready_and_generates_the_codec \
            task050_zero_oms_service_needs_no_codec \
            task050_ada_and_cpp_have_no_generated_codec; do
            require_one_test "$test" \
              cargo test -p ams-gra-codegen-oms --test service_codec "$test"
          done
      # Task 051: local element wire QNames. Frontend form/default matrix,
      # qualified non-OAM generated codecs (Record, Choice, inheritance,
      # $type), the generated non-OAM codec through mock OWP, the unqualified
      # and local-form readiness controls, and the unchanged multi-namespace
      # backend boundary. Each gate must match and pass exactly one test.
      - name: Member QName provenance (Task 051, must execute)
        run: |
          set -euo pipefail
          require_one_test() {
            name="$1"
            shift
            output="$("$@" -- --exact --nocapture 2>&1)"
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -qE "^test ${name} \.\.\. ok$"
            printf '%s\n' "$output" | grep -qE '^test result: ok\. 1 passed'
          }
          for test in \
            task051_default_unqualified_document_with_local_form_overrides \
            task051_element_namespace_is_not_the_type_namespace \
            task051_choice_alternatives_use_the_same_rule \
            task051_included_document_uses_its_own_default \
            task051_extension_members_use_the_declaring_document \
            task051_imported_documents_keep_their_own_semantics \
            task051_local_element_ref_is_still_rejected \
            task051_invalid_local_form_is_invalid_input; do
            require_one_test "$test" \
              cargo test -p ams-gra-oms-xsd-frontend --test member_qname "$test"
          done
          for test in \
            record::task051_non_oam_record_uses_clark_member_keys \
            record::task051_complete_document_combines_runtime_and_codec_keys \
            record::task051_non_oam_record_rejects_wrong_member_spellings \
            choice::task051_non_oam_choice_uses_clark_alternative_keys \
            choice::task051_non_oam_choice_rejects_wrong_alternatives \
            inheritance::task051_non_oam_inherited_record_is_flat_with_clark_keys \
            abstract_type::task051_non_oam_type_member_uses_the_concrete_type_qname \
            abstract_type::task051_non_oam_type_member_rejects_other_spellings; do
            require_one_test "$test" \
              cargo test -p ams-gra-oms-runtime-rust-facade-tests --test generated_codec_qname "$test"
          done
          require_one_test task051_non_oam_generated_codec_round_trips_through_mock_owp \
            cargo test -p ams-gra-oms-runtime-rust-facade-tests --test generated_codec_mock_owp \
            task051_non_oam_generated_codec_round_trips_through_mock_owp
          for test in \
            task051_qualified_non_oam_payload_is_codec_ready \
            task051_unqualified_member_is_model_ready_but_codec_not_ready \
            task051_local_form_overrides_decide_codec_readiness \
            task051_multi_namespace_backend_boundary_is_unchanged; do
            require_one_test "$test" \
              cargo test -p ams-gra-codegen-oms --test service_codec "$test"
          done
          for test in \
            task051_selected_projection_preserves_wire_namespaces \
            task051_effective_members_keep_their_own_provenance \
            task051_abstract_value_projection_preserves_wire_namespaces \
            task051_private_overlay_members_keep_wire_namespaces; do
            require_one_test "$test" \
              cargo test -p ams-gra-codegen-oms --test member_qname_projection "$test"
          done
      # Task 052: xs:hexBinary lexical provenance and generated Rust Binary
      # codecs. IR resolution through named restrictions, frontend
      # provenance, unknown/base64 fail-closed controls, codec-binary flip,
      # canonical encoder, lexical decoder corpora, optional/repeated/named/
      # Choice shapes, and the mock OWP loop. Each gate must match and pass
      # exactly one test.
      - name: hexBinary provenance and Binary codecs (Task 052, must execute)
        run: |
          set -euo pipefail
          require_one_test() {
            name="$1"
            shift
            output="$("$@" -- --exact --nocapture 2>&1)"
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -qE "^test ${name} \.\.\. ok$"
            printf '%s\n' "$output" | grep -qE '^test result: ok\. 1 passed'
          }
          for test in \
            tests::task052_binary_provenance_resolves_through_named_restriction_ancestry \
            tests::task052_constraint_intersection_keeps_provenance \
            tests::task052_unknown_and_non_binary_provenance_resolve_to_none \
            tests::task052_rejects_binary_provenance_on_non_binary_references; do
            require_one_test "$test" cargo test -p ams-gra-oms-ir --lib "$test"
          done
          for test in \
            task052_direct_hex_binary_field_carries_provenance \
            task052_named_restriction_chain_inherits_provenance \
            task052_choice_hex_binary_alternative_carries_provenance \
            task052_base64_binary_remains_an_explicit_unsupported_construct; do
            require_one_test "$test" \
              cargo test -p ams-gra-oms-xsd-frontend --test binary_provenance "$test"
          done
          for test in \
            service_codec::tests::task052_unknown_binary_provenance_fails_closed \
            service_codec::tests::task052_base64_binary_is_not_ready \
            service_codec::tests::task052_named_binary_uses_declaration_ancestry; do
            require_one_test "$test" \
              cargo test -p ams-gra-oms-codegen-core --lib "$test"
          done
          require_one_test task052_changed_binary_lexical_provenance_is_rejected \
            cargo test -p ams-gra-oms-codegen-core --test service_plan_binding \
            task052_changed_binary_lexical_provenance_is_rejected
          for test in \
            direct_codec_generation_renders_hex_binary_provenance \
            direct_codec_generation_fails_closed_on_unknown_binary_provenance; do
            require_one_test "$test" \
              cargo test -p ams-gra-oms-backend-rust --test service_codec "$test"
          done
          for test in \
            task052_selected_hex_binary_is_model_and_codec_ready \
            task052_hex_helpers_are_emitted_only_for_hex_binary_surfaces \
            task052_constrained_hex_binary_remains_a_model_blocker; do
            require_one_test "$test" \
              cargo test -p ams-gra-codegen-oms --test service_codec "$test"
          done
          for test in \
            task052_encoder_emits_canonical_uppercase_hex \
            task052_decoder_accepts_xsd_hex_binary_lexical_forms \
            task052_decoder_rejects_invalid_hex_binary \
            task052_decoder_accepts_only_json_strings \
            task052_optional_repeated_named_and_choice_binary_round_trip \
            task052_binary_shape_diagnostics \
            task052_codec_binary_control_round_trips; do
            require_one_test "$test" \
              cargo test -p ams-gra-oms-runtime-rust-facade-tests --test generated_codec_hexbinary "$test"
          done
          require_one_test task052_hex_binary_generated_codec_round_trips_through_mock_owp \
            cargo test -p ams-gra-oms-runtime-rust-facade-tests --test generated_codec_mock_owp \
            task052_hex_binary_generated_codec_round_trips_through_mock_owp
      # Task 052: the REAL pinned UCI 2.5 and 2.6 roots (fetched OUTSIDE the
      # repository; SHA-256 verified by the test). Every Binary must resolve
      # to HexBinary through the shared IR query, with exact counts.
      - name: Real UCI Binary provenance inventory (Task 052, must execute)
        run: |
          set -euo pipefail
          UCI_ROOT="$(scripts/fetch-pinned-uci-2.5.sh "$RUNNER_TEMP/uci-2.5")"
          UCI_26_ROOT="$(scripts/fetch-pinned-uci-2.6.sh "$RUNNER_TEMP/uci-2.6")"
          output="$(AMS_GRA_UCI_2_5_ROOT="$UCI_ROOT" AMS_GRA_UCI_2_6_ROOT="$UCI_26_ROOT" \
            cargo test --release -p ams-gra-oms-xsd-frontend --test uci_binary_provenance -- \
            --nocapture --test-threads 1 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^UCI 2.5 BINARY PROVENANCE INVENTORY: PASSED$'
          printf '%s\n' "$output" | grep -q '^UCI 2.6 BINARY PROVENANCE INVENTORY: PASSED$'
          printf '%s\n' "$output" | grep -qE '^test result: ok\. 2 passed'
      # PR #50 corrective: the runtime crates declare `rust-version = "1.95"`
      # (the pinned sleet-client needs edition 2024 let-chains). The toolchain
      # above floats on stable, so check the declared floor explicitly with the
      # committed lock file. Building Sleet itself with 1.95 (next step) does
      # NOT establish this; this step does.
      - name: Rust LA-CAL runtime MSRV (1.95.0)
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 --version
          cargo +1.95.0 check --locked -p ams-gra-oms-runtime-api
          cargo +1.95.0 check --locked -p ams-gra-oms-runtime-rust --all-targets
          cargo +1.95.0 check --locked -p ams-gra-oms-runtime-rust-facade-tests --all-targets
          # Task 050: the facade-tests crate root includes GENERATED
          # service_codec.rs (codec-oam, --with-codec), so the check above
          # already compiles generated codec source under 1.95.0. Task 051 adds
          # the generated NON-OAM codecs (runtime_test_codec, codec_choice,
          # codec_inherit, codec_shape) to that same crate root. Task 052 adds
          # the generated hexBinary codecs (codec_binary, codec_hexbinary).
          # Also compile the generated REAL PositionReport codec and (Task 052)
          # the REAL SubsystemStream hexBinary codec under 1.95.0.
          UCI_ROOT="$(scripts/fetch-pinned-uci-2.5.sh "$RUNNER_TEMP/uci-2.5")"
          AMS_GRA_UCI_2_5_ROOT="$UCI_ROOT" cargo +1.95.0 check --locked \
            -p ams-gra-oms-runtime-rust-facade-tests --all-targets
      # Task 049: the same generated facade against the UNMODIFIED Sleet
      # server at the exact pinned revision, built from a fresh checkout. The
      # script fails unless the test really ran and printed its PASSED line.
      # Task 050 adds the GENERATED-codec Sleet test and, with the pinned public
      # UCI 2.5 root fetched OUTSIDE the repository (revision and root SHA-256
      # verified by the script and again by build.rs), the REAL PositionReport
      # decode/re-encode and typed round trip through unmodified Sleet.
      - name: Rust LA-CAL runtime against real pinned Sleet (e38f61d8)
        run: |
          set -euo pipefail
          UCI_ROOT="$(scripts/fetch-pinned-uci-2.5.sh "$RUNNER_TEMP/uci-2.5")"
          export AMS_GRA_UCI_2_5_ROOT="$UCI_ROOT"
          output="$(cargo test -p ams-gra-oms-runtime-rust-facade-tests --test real_uci_position_report -- \
            --exact real::task050_real_position_report_decodes_and_re_encodes --nocapture 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^REAL POSITIONREPORT CODEC: PASSED$'
          printf '%s\n' "$output" | grep -qE '^test result: ok\. 1 passed'
          # Task 052: the REAL UCI 2.5 SubsystemStream hexBinary codec.
          output="$(cargo test -p ams-gra-oms-runtime-rust-facade-tests --test real_uci_subsystem_stream -- \
            --exact real::task052_real_subsystem_stream_hex_binary_round_trips --nocapture 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^REAL SUBSYSTEMSTREAM HEXBINARY CODEC: PASSED$'
          printf '%s\n' "$output" | grep -qE '^test result: ok\. 1 passed'
          scripts/run-real-sleet-test.sh
      # `AMS_GRA_REQUIRE_GNAT` turns the Ada probes' developer-machine skip
      # into a hard failure, so a runner that somehow lost GNAT after the gate
      # above cannot produce a green run with the Ada checks quietly elided.
      - run: cargo test --workspace
        env:
          AMS_GRA_REQUIRE_GNAT: "1"
