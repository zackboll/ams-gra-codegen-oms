              cargo test -p ams-gra-oms-codegen-core --lib "$test"
          done
          require_one_test task052_changed_binary_lexical_provenance_is_rejected \
            cargo test -p ams-gra-oms-codegen-core --test service_plan_binding \
            task052_changed_binary_lexical_provenance_is_rejected
          for test in \
            direct_codec_generation_renders_hex_binary_provenance \
            direct_codec_generation_fails_closed_on_unknown_binary_provenance; do
            require_one_test "$test" \
              cargo test -p ams-gra-oms-backend-rust --test service_codec "$test"
          done
          for test in \
            task052_selected_hex_binary_is_model_and_codec_ready \
            task052_hex_helpers_are_emitted_only_for_hex_binary_surfaces \
            task052_constrained_hex_binary_remains_a_model_blocker; do
            require_one_test "$test" \
              cargo test -p ams-gra-codegen-oms --test service_codec "$test"
          done
          for test in \
            task052_encoder_emits_canonical_uppercase_hex \
            task052_decoder_accepts_xsd_hex_binary_lexical_forms \
            task052_decoder_rejects_invalid_hex_binary \
            task052_decoder_accepts_only_json_strings \
            task052_optional_repeated_named_and_choice_binary_round_trip \
            task052_binary_shape_diagnostics \
            task052_codec_binary_control_round_trips; do
            require_one_test "$test" \
              cargo test -p ams-gra-oms-runtime-rust-facade-tests --test generated_codec_hexbinary "$test"
          done
          require_one_test task052_hex_binary_generated_codec_round_trips_through_mock_owp \
            cargo test -p ams-gra-oms-runtime-rust-facade-tests --test generated_codec_mock_owp \
            task052_hex_binary_generated_codec_round_trips_through_mock_owp
      # Task 052 real-UCI Binary provenance inventory: moved to Deep CI
      # (deep-ci.yml, job real-uci) by Task 055.
      # Task 053: constrained NAMED Binary carriers (length/minLength/maxLength
      # in octets). The shared classifier, the Ada name model, renderability
      # parity, the strict C++ and GNAT runtime/lifecycle probes (GNAT under
      # both the default and Assertion_Policy (Ignore)), the generated Rust
      # carrier + codec, and the mock OWP loop. Each gate must match and pass
      # exactly one test; zero matched tests fails the step.
      - name: Constrained Binary carriers (Task 053, must execute)
        env:
          AMS_GRA_REQUIRE_GNAT: "1"
        run: |
          set -euo pipefail
          require_one_test() {
            name="$1"
            shift
            output="$("$@" -- --exact --nocapture 2>&1)"
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -qE "^test ${name} \.\.\. ok$"
            printf '%s\n' "$output" | grep -qE '^test result: ok\. 1 passed'
          }
          for test in \
            binary::tests::task053_unconstrained_binary_is_none \
            binary::tests::task053_length_shapes_normalize_to_octet_intervals \
            binary::tests::task053_explicit_collapse_is_the_intrinsic_policy \
            binary::tests::task053_unsupported_facets_are_rejected \
            binary::tests::task053_domain_membership_is_inclusive \
            binary::tests::task053_carrier_predicate_matches_the_classifier \
            backend_names::tests::task053_constrained_binary_create_and_value_collide_with_a_type \
            backend_names::tests::task053_constrained_binary_overloads_coexist_with_other_carriers \
            backend_names::tests::task053_unconstrained_or_unsupported_binary_reserves_no_callable; do
            require_one_test "$test" cargo test -p ams-gra-oms-codegen-core --lib "$test"
          done
          for test in \
            task053_named_binary_renderability_parity \
            task053_direct_field_local_binary_facets_remain_unsupported_in_every_occurrence; do
            require_one_test "$test" \
              cargo test -p ams-gra-codegen-oms --test constrained_binary_parity "$test"
          done
          for test in \
            task053_cpp_carrier_shape_is_checked_and_copy_only \
            task053_cpp_constrained_binary_runtime_and_lifecycle \
            task053_cpp_negative_api_probes; do
            require_one_test "$test" \
              cargo test -p ams-gra-oms-backend-cpp --test constrained_binary "$test"
          done
          for test in \
            task053_ada_carrier_shape \
            task053_ada_constrained_binary_runtime_lifecycle_and_storage; do
            require_one_test "$test" \
