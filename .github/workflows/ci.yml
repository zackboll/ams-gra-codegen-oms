name: CI

# Task 055: Fast CI. The blocking, deterministic, local/synthetic regression
# path. It runs ONCE per PR head (pull_request only; a feature-branch push no
# longer starts a second, identical `push` run) and once per commit on main.
# Real pinned UCI / unmodified pinned Sleet / full real-UCI MSRV evidence lives
# in .github/workflows/deep-ci.yml (main push, nightly, manual). See
# docs/task-055-ci-fast-deep-split.md.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Only stale PR runs share a cancellation identity. Each main run is unique.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ada-websocket-transport:
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && format('oms-main-slot-{0}', matrix.slot) || format('oms-pr-{0}-{1}-{2}-ci.yml-ada-websocket-transport-{3}', github.workflow, github.run_id, github.run_attempt, matrix.compiler) }}
      queue: max
    name: ada-websocket-transport (${{ matrix.compiler }})
    needs: [changes]
    if: github.event_name != 'pull_request' || fromJSON(needs.changes.outputs.manifest).jobs['ada-websocket-transport']
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: ['14', '16']
        include:
          - compiler: '14'
            slot: 2
          - compiler: '16'
            slot: 4
    container:
      image: debian@sha256:bcf83fd8af414eda0c0a99d25a4e61dedd88e7aac7f7bc519d04555ff0c40ec5
    timeout-minutes: 90
    steps:
      - name: Verify pinned target and external compiler
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates curl unzip git python3 make gcc g++ gnat gnat-14
          test "$(uname -m)" = x86_64
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.41'
          mkdir -p /tmp/task100-evidence
          dpkg-query -W libc6 libc6-dev gnat-14 gcc-14 | tee /tmp/task100-evidence/platform.txt
          sha256sum /usr/lib/x86_64-linux-gnu/libc.so.6 /usr/bin/gnat /usr/bin/gcc | tee -a /tmp/task100-evidence/platform.txt
          gnat --version | tee -a /tmp/task100-evidence/platform.txt
          gnat --version | grep -E '^GNAT 14\.2\.0([[:space:]]|$)'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(pwd -P)" = "$(realpath "$GITHUB_WORKSPACE")"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD 'HEAD^{tree}' | tee /tmp/task100-evidence/source.txt
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          status="$(git status --porcelain)"
          test -z "$status"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install verified Alire 2.1.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          echo '09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  /tmp/alire.zip' | sha256sum --check --strict
          unzip -q /tmp/alire.zip -d /opt/alire
          test "$(/opt/alire/bin/alr --version)" = 'alr 2.1.1'
          sha256sum /opt/alire/bin/alr | tee -a /tmp/task100-evidence/platform.txt
          echo /opt/alire/bin >> "$GITHUB_PATH"
      - name: Build exact-head generator
        run: cargo +1.95.0 build --locked -p ams-gra-codegen-oms
      - name: Provision pinned compiler and GNATCOLL inputs
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/task096/setup.py --scratch /tmp/task100-evidence/setup --compiler '${{ matrix.compiler }}'
      - name: Execute generated runtime consumers and require all cells
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 scripts/task100/qualify.py --scratch /tmp/task100-evidence/campaign --setup /tmp/task100-evidence/setup --compiler '${{ matrix.compiler }}' --generator "$GITHUB_WORKSPACE/target/debug/ams-gra-codegen-oms" | tee /tmp/task100-evidence/qualify.log
          python3 - <<'EOF'
          import json
          result = json.load(open('/tmp/task100-evidence/campaign/result.json'))
          cells = result['cells']
          expected = {(n, p, a, o) for n in ['oam', 'qualified'] for p in ['portable', 'lossless']
                      for a in ['Normal', 'Check', 'Ignore'] for o in ['0', '2']}
          actual = {(c['namespace'], c['profile'], c['policy'], c['optimization']) for c in cells}
          if not result.get('completed') or len(cells) != 24 or actual != expected:
              raise SystemExit('incomplete Task 100 execution matrix')
          if any(s['exit'] != 0 for s in result['steps']):
              raise SystemExit('failed Task 100 step')
          print('TASK100_HOSTED_REQUIRED_CELLS', len(cells))
          EOF
          test "$(grep -c '^TASK100_CELL_COMPLETE ' /tmp/task100-evidence/qualify.log)" = 24
          grep -F 'TASK100_QUALIFICATION_COMPLETE' /tmp/task100-evidence/qualify.log
      - name: Record Task100 integration run identity
        shell: bash
        env:
          TASK100_COMPILER: ${{ matrix.compiler }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          from pathlib import Path
          git = lambda ref: subprocess.check_output(['git', 'rev-parse', ref], text=True).strip()
          sha = git('HEAD')
          if sha != os.environ['GITHUB_SHA']:
              raise SystemExit('Task100 source is not qualified workflow source')
          Path('/tmp/task100-evidence/integration-identity.json').write_text(json.dumps(dict(
              sha=sha, tree=git('HEAD^{tree}'), run_id=os.environ['GITHUB_RUN_ID'],
              run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], compiler=os.environ['TASK100_COMPILER'])) + '\n')
          EOF
      - name: Upload mandatory source compiler and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task100-ada-websocket-transport-${{ matrix.compiler }}
          path: |
            scripts/task100/**
            tests/ada-websocket/**
            tests/fixtures/service-generate/lacal-websocket.xsd
            tests/fixtures/service-generate/lacal-runtime.yaml
            /tmp/task100-evidence/*.txt
            /tmp/task100-evidence/integration-identity.json
            /tmp/task100-evidence/*.log
            /tmp/task100-evidence/setup/step-*
            /tmp/task100-evidence/setup/identities.json
            /tmp/task100-evidence/setup/consumer/alire/alire.lock
            /tmp/task100-evidence/campaign/**/*.json
            /tmp/task100-evidence/campaign/**/*.txt
            /tmp/task100-evidence/campaign/**/*.stdout
            /tmp/task100-evidence/campaign/**/*.stderr
            /tmp/task100-evidence/campaign/**/*.exit
            /tmp/task100-evidence/campaign/**/*.ad?
            /tmp/task100-evidence/campaign/**/*.gpr
            /tmp/task100-evidence/campaign/**/*.adc
            /tmp/task100-evidence/campaign/**/*.c
            /tmp/task100-evidence/campaign/**/*.h
            /tmp/task100-evidence/campaign/**/*.lock
            /tmp/task100-evidence/campaign/**/*.xsd
            /tmp/task100-evidence/campaign/**/*.toml
            /tmp/task100-evidence/campaign/**/LICENSE
            /tmp/task100-evidence/campaign/**/*.sha256
          if-no-files-found: error

  changes:
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'oms-main-slot-5' || format('oms-pr-{0}-{1}-{2}-ci.yml-changes', github.workflow, github.run_id, github.run_attempt) }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      manifest: ${{ steps.select.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Classify verified proposed merge (main always full)
        id: select
        run: python3 scripts/ci-select-changes.py
      - uses: actions/upload-artifact@v4
        with:
          name: ci-selection
          path: ci-selection.json
          if-no-files-found: error

  baseline:
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'oms-main-slot-5' || format('oms-pr-{0}-{1}-{2}-ci.yml-baseline', github.workflow, github.run_id, github.run_attempt) }}
      queue: max
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Mandatory documentation and fail-closed orchestration policy
        run: |
          python3 scripts/ci-policy.py
          python3 scripts/ci-doc-policy.py
          python3 -m unittest discover -s scripts -p 'test_ci_select*.py'
          python3 -m unittest discover -s scripts -p 'test_real_uci*.py'
          bash scripts/check-ci-split.sh
          bash scripts/test-check-ci-split.sh
          python3 scripts/test-task060-ci-wrappers.py
          python3 scripts/test-task061-ci-wrappers.py
          python3 scripts/test-task093-compiler-placement.py
          git diff --check
      - name: Actionlint (pinned; queue syntax also independently guarded)
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/ci-select-tools"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/ci-select-tools" actionlint
          ACTIONLINT="$RUNNER_TEMP/ci-select-tools/actionlint" bash scripts/check-ci-actionlint.sh

  deep-qualification:
    needs: changes
    if: github.event_name != 'pull_request' || fromJSON(needs.changes.outputs.manifest).deep
    uses: ./.github/workflows/deep-ci.yml
    with:
      selection: ${{ needs.changes.outputs.manifest }}

  ada-lacal-runtime-core:
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && format('oms-main-slot-{0}', matrix.slot) || format('oms-pr-{0}-{1}-{2}-ci.yml-ada-lacal-runtime-core-{3}', github.workflow, github.run_id, github.run_attempt, matrix.compiler) }}
      queue: max
    name: ada-lacal-runtime-core (${{ matrix.compiler }})
    needs: [changes]
    if: github.event_name != 'pull_request' || fromJSON(needs.changes.outputs.manifest).jobs['ada-lacal-runtime-core']
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: ['14', '16']
        include:
          - compiler: '14'
            slot: 1
          - compiler: '16'
            slot: 3
    container:
      image: debian@sha256:bcf83fd8af414eda0c0a99d25a4e61dedd88e7aac7f7bc519d04555ff0c40ec5
    timeout-minutes: 90
    steps:
      - name: Verify pinned target and external compiler
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates curl unzip git python3 make gcc g++ gnat gnat-14
          test "$(uname -m)" = x86_64
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.41'
          mkdir -p /tmp/task099-evidence
          dpkg-query -W libc6 libc6-dev gnat-14 gcc-14 | tee /tmp/task099-evidence/platform.txt
          sha256sum /usr/lib/x86_64-linux-gnu/libc.so.6 /usr/bin/gnat /usr/bin/gcc | tee -a /tmp/task099-evidence/platform.txt
          gnat --version | tee -a /tmp/task099-evidence/platform.txt
          gnat --version | grep -E '^GNAT 14\.2\.0([[:space:]]|$)'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(pwd -P)" = "$(realpath "$GITHUB_WORKSPACE")"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD 'HEAD^{tree}' | tee /tmp/task099-evidence/source.txt
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          status="$(git status --porcelain)"
          test -z "$status"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install verified Alire 2.1.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          echo '09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  /tmp/alire.zip' | sha256sum --check --strict
          unzip -q /tmp/alire.zip -d /opt/alire
          test "$(/opt/alire/bin/alr --version)" = 'alr 2.1.1'
          sha256sum /opt/alire/bin/alr | tee -a /tmp/task099-evidence/platform.txt
          echo /opt/alire/bin >> "$GITHUB_PATH"
      - name: Build exact-head generator
        run: cargo +1.95.0 build --locked -p ams-gra-codegen-oms
      - name: Provision pinned compiler and GNATCOLL inputs
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/task096/setup.py --scratch /tmp/task099-evidence/setup --compiler '${{ matrix.compiler }}'
      - name: Execute generated runtime consumers and require all cells
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 scripts/task099/qualify.py --scratch /tmp/task099-evidence/campaign --setup /tmp/task099-evidence/setup --compiler '${{ matrix.compiler }}' --generator "$GITHUB_WORKSPACE/target/debug/ams-gra-codegen-oms" | tee /tmp/task099-evidence/qualify.log
          python3 - <<'EOF'
          import json
          result = json.load(open('/tmp/task099-evidence/campaign/result.json'))
          cells = result['cells']
          expected = {(n, p, a, o) for n in ['oam', 'qualified'] for p in ['portable', 'lossless']
                      for a in ['Normal', 'Check', 'Ignore'] for o in ['0', '2']}
          actual = {(c['namespace'], c['profile'], c['policy'], c['optimization']) for c in cells}
          if not result.get('completed') or not result.get('production_generated') or len(cells) != 24 or actual != expected:
              raise SystemExit('incomplete Task 099 execution matrix')
          if any(c['checks'] != (62 if c['profile'] == 'lossless' else 53) for c in cells):
              raise SystemExit('wrong Task 099 check count')
          if any(s['exit'] != 0 for s in result['steps']):
              raise SystemExit('failed Task 099 step')
          print('TASK099_HOSTED_REQUIRED_CELLS', len(cells))
          EOF
          test "$(grep -c '^TASK099_CELL_COMPLETE ' /tmp/task099-evidence/qualify.log)" = 24
          grep -F 'TASK099_QUALIFICATION_COMPLETE' /tmp/task099-evidence/qualify.log
      - name: Upload mandatory source compiler and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task099-ada-lacal-runtime-core-${{ matrix.compiler }}
          path: |
            /tmp/task099-evidence/*.txt
            /tmp/task099-evidence/*.log
            /tmp/task099-evidence/setup/step-*
            /tmp/task099-evidence/setup/identities.json
            /tmp/task099-evidence/setup/consumer/alire/alire.lock
            /tmp/task099-evidence/campaign/*.json
            /tmp/task099-evidence/campaign/*.stdout
            /tmp/task099-evidence/campaign/*.stderr
            /tmp/task099-evidence/campaign/*.exit
            /tmp/task099-evidence/campaign/*.xsd
            /tmp/task099-evidence/campaign/*-generated/*.ad?
            /tmp/task099-evidence/campaign/*-O*-*/runtime_consumer.adb
            /tmp/task099-evidence/campaign/ada/oms-lacal-runtime/src/*.ad?
          if-no-files-found: error

  ada-float64-codec:
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && format('oms-main-slot-{0}', matrix.slot) || format('oms-pr-{0}-{1}-{2}-ci.yml-ada-float64-codec-{3}', github.workflow, github.run_id, github.run_attempt, matrix.compiler) }}
      queue: max
    name: ada-float64-codec (${{ matrix.compiler }})
    needs: [changes]
    if: github.event_name != 'pull_request' || fromJSON(needs.changes.outputs.manifest).jobs['ada-float64-codec']
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: ['14', '16']
        include:
          - compiler: '14'
            slot: 1
          - compiler: '16'
            slot: 2
    container:
      image: debian@sha256:bcf83fd8af414eda0c0a99d25a4e61dedd88e7aac7f7bc519d04555ff0c40ec5
    timeout-minutes: 90
    steps:
      - name: Fresh target preflight and external GNAT verification
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates curl unzip git python3 make gcc g++ gnat gnat-14 locales
          test "$(uname -m)" = x86_64
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.41'
          localedef -i de_DE -f UTF-8 de_DE.UTF-8
          mkdir -p /tmp/task097-evidence
          dpkg-query -W libc6 libc6-dev gnat-14 gcc-14 | tee /tmp/task097-evidence/platform.txt
          sha256sum /usr/lib/x86_64-linux-gnu/libc.so.6 /usr/bin/gnat /usr/bin/gcc | tee -a /tmp/task097-evidence/platform.txt
          gnat --version | tee -a /tmp/task097-evidence/platform.txt
          gnat --version | grep -E '^GNAT 14\.2\.0([[:space:]]|$)'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_WORKSPACE:-}"
          test "$(pwd -P)" = "$(realpath "$GITHUB_WORKSPACE")"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD 'HEAD^{tree}' | tee /tmp/task097-evidence/source.txt
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = '${{ github.sha }}'
          porcelain="$(git status --porcelain)"
          test -z "$porcelain"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install verified Alire 2.1.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          echo '09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  /tmp/alire.zip' | sha256sum --check --strict
          unzip -q /tmp/alire.zip -d /opt/alire
          test "$(/opt/alire/bin/alr --version)" = 'alr 2.1.1'
          sha256sum /opt/alire/bin/alr | tee -a /tmp/task097-evidence/platform.txt
          echo /opt/alire/bin >> "$GITHUB_PATH"
      - name: Build exact-head production generator
        run: cargo +1.95.0 build --locked -p ams-gra-codegen-oms
      - name: Production binary64 generated-code qualification
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p /tmp/task097-evidence/tmp
          export TMPDIR=/tmp/task097-evidence/tmp
          python3 scripts/task097/job.py /tmp/task097-evidence/job -- python3 scripts/task097/qualify.py --scratch /tmp/task097-evidence/campaign --compiler '${{ matrix.compiler }}' --generator "$GITHUB_WORKSPACE/target/debug/ams-gra-codegen-oms"
          test -s /tmp/task097-evidence/campaign/result.json
          python3 - <<'EOF'
          import json
          result = json.load(open("/tmp/task097-evidence/campaign/result.json"))
          labels = {step["label"]: step["exit"] for step in result["steps"]}
          required = ["oracle-independent-review", "checkpoint", "composition-oam", "composition-qualified",
                      "generated-oam", "generated-qualified", "environment-oam", "environment-qualified",
                      "conformance-oam", "conformance-qualified", "generated-oam-O2", "conformance-oam-O2"]
          missing = [label for label in required if labels.get(label) != 0]
          if not result.get("completed") or not result.get("production_generated") or missing:
              raise SystemExit(f"incomplete production Float64 qualification: {missing}")
          print("TASK097_HOSTED_REQUIRED_STEPS", len(required))
          EOF
      - name: Preserve complete textual qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task097-platform-qualified-float64-${{ matrix.compiler }}
          path: |
            /tmp/task097-evidence/**/*.json
            /tmp/task097-evidence/**/*.stdout
            /tmp/task097-evidence/**/*.stderr
            /tmp/task097-evidence/**/*.log
            /tmp/task097-evidence/**/*.exit
            /tmp/task097-evidence/**/*.txt
            /tmp/task097-evidence/**/*.tsv
            /tmp/task097-evidence/**/*.lock
            /tmp/task097-evidence/**/*.toml
            /tmp/task097-evidence/**/consumer/*.adb
            /tmp/task097-evidence/**/consumer/*.ads
            /tmp/task097-evidence/**/support/**/*.adb
            /tmp/task097-evidence/**/support/**/*.ads
            /tmp/task097-evidence/**/support/**/*.c
            /tmp/task097-evidence/**/support/**/*.h
          if-no-files-found: error
  ada-time-zulu-codec:
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && format('oms-main-slot-{0}', matrix.slot) || format('oms-pr-{0}-{1}-{2}-ci.yml-ada-time-zulu-codec-{3}', github.workflow, github.run_id, github.run_attempt, matrix.compiler) }}
      queue: max
    name: ada-time-zulu-codec (${{ matrix.compiler }})
    needs: [changes]
    if: github.event_name != 'pull_request' || fromJSON(needs.changes.outputs.manifest).jobs['ada-time-zulu-codec']
    # Task 098: focused named TimeZulu codec execution. Same pinned target and
    # provisioning as ada-float64-codec, but only the synthetic Time matrix:
    # portable, Float32 and lossless profiles x OAM/qualified x 3 policies.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: ['14', '16']
        include:
          - compiler: '14'
            slot: 4
          - compiler: '16'
            slot: 3
    container:
      image: debian@sha256:bcf83fd8af414eda0c0a99d25a4e61dedd88e7aac7f7bc519d04555ff0c40ec5
    timeout-minutes: 60
    steps:
      - name: Fresh target preflight and external GNAT verification
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates curl unzip git python3 make gcc g++ gnat gnat-14 locales
          test "$(uname -m)" = x86_64
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.41'
          localedef -i de_DE -f UTF-8 de_DE.UTF-8
          mkdir -p /tmp/task098-evidence
          dpkg-query -W libc6 libc6-dev gnat-14 gcc-14 | tee /tmp/task098-evidence/platform.txt
          sha256sum /usr/lib/x86_64-linux-gnu/libc.so.6 /usr/bin/gnat /usr/bin/gcc | tee -a /tmp/task098-evidence/platform.txt
          gnat --version | tee -a /tmp/task098-evidence/platform.txt
          gnat --version | grep -E '^GNAT 14\.2\.0([[:space:]]|$)'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          # Checkout uses a temporary HOME; trust only this runner checkout
          # in the shell HOME as well, without bypassing the identity checks.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD 'HEAD^{tree}' | tee /tmp/task098-evidence/source.txt
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          status="$(git status --porcelain)"
          test -z "$status"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install verified Alire 2.1.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          echo '09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  /tmp/alire.zip' | sha256sum --check --strict
          unzip -q /tmp/alire.zip -d /opt/alire
          test "$(/opt/alire/bin/alr --version)" = 'alr 2.1.1'
          sha256sum /opt/alire/bin/alr | tee -a /tmp/task098-evidence/platform.txt
          echo /opt/alire/bin >> "$GITHUB_PATH"
      - name: Build exact-head production generator
        run: cargo +1.95.0 build --locked -p ams-gra-codegen-oms
      - name: Fresh compiler provisioning
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/task096/setup.py --scratch /tmp/task098-evidence/setup --compiler '${{ matrix.compiler }}'
      - name: Generated named TimeZulu codec execution (3 profiles x 2 namespaces x 3 policies)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 scripts/task098/qualify.py --scratch /tmp/task098-evidence/campaign --setup /tmp/task098-evidence/setup --compiler '${{ matrix.compiler }}' --generator "$GITHUB_WORKSPACE/target/debug/ams-gra-codegen-oms" | tee /tmp/task098-evidence/qualify.log
          python3 - <<'EOF'
          import json
          result = json.load(open("/tmp/task098-evidence/campaign/result.json"))
          cells = {(c["namespace"], c["profile"], c["policy"]) for c in result["cells"]}
          expected = {(n, p, q) for n in ["oam", "qualified"] for p in ["portable", "float32", "lossless"]
                      for q in ["Normal", "Check", "Ignore"]}
          if not result.get("completed") or not result.get("production_generated") or cells != expected:
              raise SystemExit(f"incomplete Task 098 qualification: {sorted(expected - cells)}")
          if len(result["cells"]) != 18 or any(
              (c["documents"], c["accepted"], c["rejected"]) != (156, 38, 118)
              for c in result["cells"]
          ):
              raise SystemExit("wrong Task 098 cell counts")
          print("TASK098_HOSTED_REQUIRED_CELLS", len(cells))
          EOF
      - name: Preserve complete textual qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task098-ada-time-zulu-codec-${{ matrix.compiler }}
          path: |
            /tmp/task098-evidence/*.txt
            /tmp/task098-evidence/*.log
            /tmp/task098-evidence/setup/step-*
            /tmp/task098-evidence/setup/identities.json
            /tmp/task098-evidence/campaign/*.json
            /tmp/task098-evidence/campaign/*.jsonl
            /tmp/task098-evidence/campaign/*.stdout
            /tmp/task098-evidence/campaign/*.stderr
            /tmp/task098-evidence/campaign/*.exit
            /tmp/task098-evidence/campaign/*.xsd
            /tmp/task098-evidence/campaign/*-generated/*.ads
            /tmp/task098-evidence/campaign/*-generated/*.adb
          if-no-files-found: error

  python-model-backend:
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && format('oms-main-slot-{0}', matrix.slot) || format('oms-pr-{0}-{1}-{2}-ci.yml-python-model-backend-{3}', github.workflow, github.run_id, github.run_attempt, matrix.python-version) }}
      queue: max
    name: python-model-backend (${{ matrix.python-version }})
    needs: [changes]
    if: github.event_name != 'pull_request' || fromJSON(needs.changes.outputs.manifest).jobs['python-model-backend']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
        include:
          - python-version: '3.11'
            slot: 1
          - python-version: '3.13'
            slot: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qualify Python model generation (runtime probes must execute)
        env:
          PYTHON: python
        run: |
          python -c 'import sys; assert sys.version_info >= (3, 11); print(sys.version)'
          cargo test --locked -p ams-gra-oms-backend-python --all-targets -- --nocapture
          cargo test --locked -p ams-gra-codegen-oms --test python_cli -- --nocapture
          cargo test --locked -p ams-gra-codegen-oms --test python_service -- --nocapture
          cargo test --locked -p ams-gra-codegen-oms --test python_codec -- --nocapture
          cargo test --locked -p ams-gra-codegen-oms --test python_header_profiles -- --nocapture
          cargo test --locked -p ams-gra-codegen-oms --test python_inheritance -- --nocapture
          cargo test --locked -p ams-gra-codegen-oms --test python_float64 -- --nocapture
          python scripts/test-py007-uci.py
          python scripts/test-py008-uci.py
          cargo fmt --all -- --check
          cargo clippy --locked -p ams-gra-oms-backend-python -p ams-gra-codegen-oms --all-targets -- -D warnings
          cargo build --locked -p ams-gra-oms-backend-python -p ams-gra-codegen-oms --all-targets
      - name: Focused independent Float64 numeric controls (PY-008)
        run: |
          set -euo pipefail
          python tests/ada-float64-probe/oracle.py "$RUNNER_TEMP/py008-corpus"
          target/debug/ams-gra-codegen-oms service-generate --schema tests/fixtures/python-float64/oam.xsd --contract tests/fixtures/python-float64/service.yaml --language python --world closed-schema --with-codec --output "$RUNNER_TEMP/py008-generated"
          python scripts/check-py008-numeric.py --generated "$RUNNER_TEMP/py008-generated" --corpus "$RUNNER_TEMP/py008-corpus" --output "$RUNNER_TEMP/py008-normal.json"
          python -O scripts/check-py008-numeric.py --generated "$RUNNER_TEMP/py008-generated" --corpus "$RUNNER_TEMP/py008-corpus" --output "$RUNNER_TEMP/py008-optimized.json"
      - name: Python LA-CAL actual network mock qualification (PY-005)
        run: |
          python -m pip install ./python/oms-lacal-runtime
          PYTHON=python bash scripts/check-py005-mock.sh

  ada-float32-codec:
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'oms-main-slot-3' || format('oms-pr-{0}-{1}-{2}-ci.yml-ada-float32-codec', github.workflow, github.run_id, github.run_attempt) }}
      queue: max
    needs: [changes]
    if: github.event_name != 'pull_request' || fromJSON(needs.changes.outputs.manifest).jobs['ada-float32-codec']
    runs-on: ubuntu-24.04
    container:
      image: debian@sha256:bcf83fd8af414eda0c0a99d25a4e61dedd88e7aac7f7bc519d04555ff0c40ec5
    timeout-minutes: 90
    steps:
      - name: Provision and verify qualified target
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates curl unzip git python3 make gcc g++ gnat gnat-14 locales
          test "$(uname -m)" = x86_64
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.41'
          localedef -i de_DE -f UTF-8 de_DE.UTF-8
          mkdir -p /tmp/task095-evidence
          dpkg-query -W libc6 gnat-14 > /tmp/task095-evidence/platform.txt
          sha256sum /usr/lib/x86_64-linux-gnu/libc.so.6 >> /tmp/task095-evidence/platform.txt
          command -v gnat | tee -a /tmp/task095-evidence/platform.txt
          gnat --version | tee -a /tmp/task095-evidence/platform.txt
          gnat --version | grep -E '^GNAT 14\.2\.0([[:space:]]|$)'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install verified Alire 2.1.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          echo '09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  /tmp/alire.zip' | sha256sum --check --strict
          unzip -q /tmp/alire.zip -d /opt/alire
          test "$(/opt/alire/bin/alr --version)" = 'alr 2.1.1'
          echo /opt/alire/bin >> "$GITHUB_PATH"
      - name: Build exact-head production generator
        run: cargo +1.95.0 build --locked -p ams-gra-codegen-oms
      - name: Verify ABI environment and bridge failures
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -O0 -Wall -Wextra -Werror ada/oms-json-support/float32/ams_gra_float32.c tests/ada-float32-probe/bridge_controls.c -Wl,--wrap=newlocale -Wl,--wrap=gnu_get_libc_version -lm -o /tmp/task095-evidence/bridge-controls
          /tmp/task095-evidence/bridge-controls > /tmp/task095-evidence/bridge.log
          grep -Fx 'TASK095_BRIDGE_CONTROLS_COMPLETE checks=20' /tmp/task095-evidence/bridge.log
          gcc -std=c11 -O2 -Wall -Wextra -Werror ada/oms-json-support/float32/ams_gra_float32.c tests/ada-float32-probe/environment_controls.c tests/ada-float32-probe/environment_harness.c -lm -o /tmp/task095-evidence/environment-controls
          for mode in 0 1 2 3; do
            /tmp/task095-evidence/environment-controls "$mode" > "/tmp/task095-evidence/environment-$mode.log"
            count=35; if test "$mode" = 0; then count=32; fi
            grep -Fx "TASK095_C2_C_ENVIRONMENT_COMPLETE mode=$mode checks=$count" "/tmp/task095-evidence/environment-$mode.log"
          done
      - name: Execute both compilers profiles and assertion policies
        shell: bash
        run: |
          set -euo pipefail
          for compiler in 14 16; do
            for profile in oam qualified; do
              python3 scripts/check-task095.py --compiler "$compiler" --profile "$profile" --numeric-corpus --environment --rounding --scratch "/tmp/task095-evidence/$compiler-$profile" --generator "$GITHUB_WORKSPACE/target/debug/ams-gra-codegen-oms"
              sha256sum --check --quiet "/tmp/task095-evidence/$compiler-$profile/sources.sha256"
              test -s "/tmp/task095-evidence/$compiler-$profile/result.json"
              python3 scripts/check-task095.py --compiler "$compiler" --profile "$profile" --identifiers --scratch "/tmp/task095-evidence/identifiers-$compiler-$profile" --generator "$GITHUB_WORKSPACE/target/debug/ams-gra-codegen-oms"
            done
            python3 scripts/check-task095.py --compiler "$compiler" --profile oam --environment --rounding --optimized --scratch "/tmp/task095-evidence/optimized-$compiler" --generator "$GITHUB_WORKSPACE/target/debug/ams-gra-codegen-oms"
          done
      - name: Independent x87 MXCSR C rounding matrix O0 and O2
        run: python3 scripts/check-task095-rounding.py --scratch /tmp/task095-evidence/c-rounding
      - name: Binary Float32 composition in the qualified runtime
        shell: bash
        run: |
          set -euo pipefail
          for compiler in 14 16; do
            python3 scripts/check-task093-mixed.py --compiler "$compiler" --scratch "/tmp/task095-evidence/task093-mixed-$compiler" --generator "$GITHUB_WORKSPACE/target/debug/ams-gra-codegen-oms"
            sha256sum --check --quiet "/tmp/task095-evidence/task093-mixed-$compiler/sources.sha256"
            test -s "/tmp/task095-evidence/task093-mixed-$compiler/result.json"
          done
      - name: Float32-only helper-demand naming regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_perf005_ci.py'
          python3 scripts/perf005-ci.py --compilers 14 16 --alr /opt/alire/bin/alr --runtime-root /var/tmp/perf005-float32 --evidence /tmp/task095-evidence/perf005-ci --generator "$GITHUB_WORKSPACE/target/debug/ams-gra-codegen-oms"
          test -s /tmp/task095-evidence/perf005-ci/summary.json
          sha256sum --check --quiet /tmp/task095-evidence/perf005-ci/evidence.sha256
      - name: Portable GNAT 14 helper-demand naming regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-task093-helper-demand.py --family portable --compiler 14 --scratch /tmp/task095-evidence/task093-c5-portable-14 --generator "$GITHUB_WORKSPACE/target/debug/ams-gra-codegen-oms"
          sha256sum --check --quiet /tmp/task095-evidence/task093-c5-portable-14/sources.sha256
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task095-platform-qualified-float32
          path: |
            /tmp/task095-evidence/*.txt
            /tmp/task095-evidence/*.log
            /tmp/task095-evidence/*/*.log
            /tmp/task095-evidence/*/*.exit
            /tmp/task095-evidence/*/*.lock
            /tmp/task095-evidence/*/*.sha256
            /tmp/task095-evidence/*/result.json
            /tmp/task095-evidence/*/*-rounding-pairs.json
            /tmp/task095-evidence/*/*.command.json
            /tmp/task095-evidence/*/consumer/*.ads
            /tmp/task095-evidence/*/consumer/*.adb
            /tmp/task095-evidence/*/consumer/*.c
            /tmp/task095-evidence/task093-mixed-*/**
            /tmp/task095-evidence/task093-c4-*/**
            /tmp/task095-evidence/perf005-ci/**
            /tmp/task095-evidence/task093-c5-portable-14/**
          if-no-files-found: error
