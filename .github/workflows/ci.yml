          done
          output="$(cargo test -p ams-gra-codegen-oms --test member_remapping -- \
            --exact task054_ada_escaped_members_compile_and_run --nocapture 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^TASK054 ADA ESCAPED MEMBERS: PASSED$'
          printf '%s\n' "$output" | grep -qE '^test result: ok\. 1 passed'
          for test in \
            task054_codec_wire_names_stay_source_names_and_round_trip \
            task054_escaped_host_names_are_not_wire_aliases \
