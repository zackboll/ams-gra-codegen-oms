  rust:
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'oms-main-slot-5' || format('oms-pr-{0}-{1}-{2}-ci.yml-rust', github.workflow, github.run_id, github.run_attempt) }}
      queue: max
    needs: [changes]
    if: github.event_name != 'pull_request' || fromJSON(needs.changes.outputs.manifest).jobs['rust']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Task 033 ships Ada regressions that only have force when a real GNAT
      # toolchain is present. The Rust tests skip themselves when `gnatmake`
      # is missing, which is right for developer machines but would let CI go
      # green without ever checking the generated Ada. Installing GNAT here,
      # and gating on it below, makes that skip impossible on the runner.
      - name: Install GNAT and Python regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat strace
      # Hard gate: no `|| true`. If GNAT is absent or broken, CI fails here
      # rather than silently degrading the Ada regressions into no-ops. The
      # version is printed so the log records which toolchain ran the tests.
      - name: Verify GNAT availability
        run: |
          command -v gnatmake
          gnatmake --version
      - name: Python synthetic and Pages regression tests (CI-PAGES-001)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - name: Duplicate-member ingress policy (Task 077)
        run: |
          bash scripts/test-task077-ci-wrappers.sh
          bash scripts/check-task077-fast.sh
      - name: Contract route manifest and Sleet policy (Task 071)
        run: bash scripts/check-task071-fast.sh
      - name: Exact semantic schema diff Fast controls (Task 069)
        run: |
          python3 scripts/test-task069-ci-wrappers.py
          bash scripts/check-task069-fast.sh
      - name: Exact patterned integral Fast gates (Task 063)
        env:
          AMS_GRA_REQUIRE_GNAT: "1"
        run: bash scripts/check-task063-fast.sh
      - run: python3 scripts/test-task063-ci-wrappers.py
      - name: Named TimeZulu (Task 061, exact compiler/codec/readiness gates)
        env:
          AMS_GRA_REQUIRE_GNAT: "1"
        run: bash scripts/check-task061-fast.sh
      - name: Exact IPv6 synthetic gates (Task 062)
        run: |
          python3 scripts/test-task062-ci-wrappers.py
          bash scripts/check-task062-fast.sh
      - name: Ada semantic artifact naming gates (Task 065)
        env:
          AMS_GRA_REQUIRE_GNAT: "1"
        run: bash scripts/check-task065-fast.sh
      - name: Exact Unicode 3.1 profile gates (Task 066)
        run: |
          python3 scripts/test-task066-ci-wrappers.py
          bash scripts/check-task066-fast.sh
      - run: cargo check --workspace --all-targets
      - name: Bounded initial LA-CAL connection retry (Task 070)
        run: bash scripts/check-task070-fast.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The four GNAT-backed Task 033 regressions are named explicitly so the
      # log proves each one executed. `require_one_test` fails the step if a
      # filter matches nothing, since a passing run of zero tests is exactly
      # the false green this workflow change exists to prevent.
      - name: Service generated-support binding (Task 064, must execute)
        run: |
          set -euo pipefail
          status=0
          listing="$(cargo test -p ams-gra-oms-codegen-core --test generated_support_binding -- --list 2>&1)" || status=$?
          printf '%s\n' "$listing"
          if (( status != 0 )); then exit "$status"; fi
          for name in changed_support_rejected_with_readiness_generation_parity added_descendant_changes_closed_support_topology removed_descendant_is_typed_missing_support transitive_support_dependency_is_bound nested_abstract_value_support_is_bound task026_absent_only_topology_becoming_inhabited_is_bound simultaneous_support_changes_use_original_schema_order_not_names_or_stack added_descendants_use_supplied_schema_order compatible_rebuild_and_provenance_and_unrelated_edits_are_accepted selected_only_concrete_service_has_no_support_binding open_world_preserves_authoritative_abstract_value_failure member_wire_namespace_is_bound_for_selected_and_support_members; do
            grep -Fqx "$name: test" <<<"$listing"
            status=0
            output="$(cargo test -p ams-gra-oms-codegen-core --test generated_support_binding "$name" -- --exact --nocapture 2>&1)" || status=$?
            printf '%s\n' "$output"
            if (( status != 0 )); then exit "$status"; fi
            grep -qE '^test result: ok\. 1 passed' <<<"$output"
          done
          echo 'TASK064 SYNTHETIC BINDING MATRIX: PASSED'
          for name in task064_compatible_schema_preserves_readiness_generated_source_and_codec task064_wire_namespace_changes_actual_codec_spelling_and_invalidates_old_plan; do
            status=0
            listing="$(cargo test -p ams-gra-codegen-oms --test generated_support_binding -- --list 2>&1)" || status=$?
            printf '%s\n' "$listing"
            if (( status != 0 )); then exit "$status"; fi
            grep -Fqx "$name: test" <<<"$listing"
            status=0
            output="$(cargo test -p ams-gra-codegen-oms --test generated_support_binding "$name" -- --exact --nocapture 2>&1)" || status=$?
            printf '%s\n' "$output"
            if (( status != 0 )); then exit "$status"; fi
            grep -qE '^test result: ok\. 1 passed' <<<"$output"
            grep -q 'TASK064 .*: PASSED' <<<"$output"
          done
          name=service_readiness::tests::task056_support_readiness_builds_one_projection_and_one_analysis
          status=0
          listing="$(cargo test -p ams-gra-oms-codegen-core --lib -- --list 2>&1)" || status=$?
          printf '%s\n' "$listing"
          if (( status != 0 )); then exit "$status"; fi
          grep -Fqx "$name: test" <<<"$listing"
          status=0
          output="$(cargo test -p ams-gra-oms-codegen-core --lib "$name" -- --exact --nocapture 2>&1)" || status=$?
          printf '%s\n' "$output"
          if (( status != 0 )); then exit "$status"; fi
          grep -qE '^test result: ok\. 1 passed' <<<"$output"
          echo 'TASK064 SINGLE PROJECTION EXPANSION ANALYSIS: PASSED'
      - name: Ada regressions (GNAT-backed, must execute)
        run: |
          set -euo pipefail
          require_one_test() {
            name="$1"
            shift
            output="$("$@" -- --exact --nocapture 2>&1)"
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -qE "^test ${name} \.\.\. ok$"
            printf '%s\n' "$output" | grep -qE '^test result: ok\. 1 passed'
          }
          require_one_test tests::constrained_floats_enforce_predicates_under_gnat \
            cargo test -p ams-gra-oms-backend-ada --lib \
            tests::constrained_floats_enforce_predicates_under_gnat
          require_one_test tests::constrained_floats_reject_public_bypasses_under_gnat \
            cargo test -p ams-gra-oms-backend-ada --lib \
            tests::constrained_floats_reject_public_bypasses_under_gnat
          require_one_test task033_selected_ada_float_predicates_hold_under_gnat \
            cargo test -p ams-gra-codegen-oms --test service_generate \
            task033_selected_ada_float_predicates_hold_under_gnat
          require_one_test task033_selected_ada_float_rejects_public_bypasses \
            cargo test -p ams-gra-codegen-oms --test service_generate \
            task033_selected_ada_float_rejects_public_bypasses
          # Corrective cleanup: the shared backend name preflight must not just
          # reject unsafe names, it must still let a safe control schema
          # produce Ada that GNAT actually accepts.
          require_one_test tests::preflight_control_renders_and_compiles \
            cargo test -p ams-gra-oms-backend-ada --lib \
            tests::preflight_control_renders_and_compiles
          # Task 040 corrective: repeated storage of validated carriers. These
          # are the probes that actually execute container operations, so a run
          # that skipped them would restate the exact false green that let the
          # vector-growth regression reach review. Zero matched tests is a
          # failure here for the same reason.
          require_one_test repeated_carrier_storage_is_usable_under_gnat \
            cargo test -p ams-gra-oms-backend-ada \
            --test repeated_carrier_storage \
            repeated_carrier_storage_is_usable_under_gnat
          require_one_test repeated_storage_never_declares_a_live_carrier_for_spare_capacity \
            cargo test -p ams-gra-oms-backend-ada \
            --test repeated_carrier_storage \
            repeated_storage_never_declares_a_live_carrier_for_spare_capacity
          require_one_test task040_selected_ada_repeated_field_is_constructible \
            cargo test -p ams-gra-codegen-oms --test service_generate \
            task040_selected_ada_repeated_field_is_constructible
          # Task 040 corrective, pass two. The bounded-occupancy controls live
          # inside the two repeated-storage probes above, which already run
          # here. These are the new focused regressions the second pass adds,
          # named explicitly for the same reason: a phantom callable or a
          # renamed sequence operation is a silent-acceptance failure, so a run
          # that matched zero tests must fail rather than report green.
          require_one_test tests::emitted_sequence_operations_are_exactly_the_shared_definition \
            cargo test -p ams-gra-oms-backend-ada --lib \
            tests::emitted_sequence_operations_are_exactly_the_shared_definition
          require_one_test backend_names::tests::a_non_emitted_abstract_record_reserves_no_sequence_callable \
            cargo test -p ams-gra-oms-codegen-core --lib \
            backend_names::tests::a_non_emitted_abstract_record_reserves_no_sequence_callable
          require_one_test backend_names::tests::an_inherited_unbounded_member_attributes_callables_to_the_descendant \
            cargo test -p ams-gra-oms-codegen-core --lib \
            backend_names::tests::an_inherited_unbounded_member_attributes_callables_to_the_descendant
          require_one_test backend_names::tests::bounded_shapes_reserve_exactly_the_operations_they_emit \
            cargo test -p ams-gra-oms-codegen-core --lib \
            backend_names::tests::bounded_shapes_reserve_exactly_the_operations_they_emit
          require_one_test backend_names::tests::an_emitted_sequence_still_collides_with_a_conflicting_type_name \
            cargo test -p ams-gra-oms-codegen-core --lib \
            backend_names::tests::an_emitted_sequence_still_collides_with_a_conflicting_type_name
          # The ORIGINAL Task 040 scalar/optional lifecycle controls must keep
          # passing alongside the corrected repeated paths.
          require_one_test a_default_declared_carrier_cannot_silently_hold_invalid_text_under_gnat \
            cargo test -p ams-gra-oms-backend-ada --test carrier_lifecycle \
            a_default_declared_carrier_cannot_silently_hold_invalid_text_under_gnat
          require_one_test legitimate_construction_paths_still_work_under_gnat \
            cargo test -p ams-gra-oms-backend-ada --test carrier_lifecycle \
            legitimate_construction_paths_still_work_under_gnat
          # Task 046: require the generated GNAT direct dateTime parser probe.
          require_one_test direct_date_time_and_named_zulu_share_the_gnat_parser \
            cargo test -p ams-gra-oms-backend-ada --test direct_datetime \
            direct_date_time_and_named_zulu_share_the_gnat_parser
          # Task 057: the shared duration corpus against the named and direct
          # Ada carriers, under the default policy and Assertion_Policy (Ignore).
          require_one_test named_and_direct_duration_share_the_gnat_validator_under_both_policies \
            cargo test -p ams-gra-oms-backend-ada --test duration \
            named_and_direct_duration_share_the_gnat_validator_under_both_policies
          # Task 058: the shared bounded-ASCII corpus (every admitted alphabet)
          # against the generated Ada carriers, -gnatwa on the package, plus
          # zero-length storage and Task 040 default rejection, under the
          # default policy and Assertion_Policy (Ignore).
          require_one_test generated_bounded_ascii_validators_match_the_shared_corpus_under_both_policies \
            cargo test -p ams-gra-oms-backend-ada --test bounded_ascii \
            generated_bounded_ascii_validators_match_the_shared_corpus_under_both_policies
          require_one_test generated_structured_ascii_ada_corpus_under_both_policies \
            cargo test -p ams-gra-oms-backend-ada --test structured_ascii \
            generated_structured_ascii_ada_corpus_under_both_policies
          # Task 060 corrective: actual generated factored carrier construction
