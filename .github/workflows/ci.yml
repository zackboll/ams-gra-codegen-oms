              cargo test -p ams-gra-oms-runtime-rust-facade-tests --test generated_codec_member_remapping "$test"
          done
      # Task 054 real-UCI member identifier inventory, whole-schema first
      # blocker probe and real category-A compile: moved to Deep CI
      # (deep-ci.yml, job real-uci) by Task 055.
      # PR #50 corrective: the runtime crates declare `rust-version = "1.95"`
      # (the pinned sleet-client needs edition 2024 let-chains). The toolchain
      # above floats on stable, so check the declared floor explicitly with the
      # committed lock file.
      # Task 050: the facade-tests crate root includes GENERATED
      # service_codec.rs (codec-oam, --with-codec), so the facade-tests check
      # compiles generated codec source under 1.95.0. Task 051 adds the
      # generated NON-OAM codecs (runtime_test_codec, codec_choice,
      # codec_inherit, codec_shape) to that same crate root. Task 052 adds the
      # generated hexBinary codecs (codec_binary, codec_hexbinary). Task 053
      # adds constrained_binary: the generated checked Binary carriers
      # (`u64::try_from(len)`) and their codec, under 1.95.0.
      # Task 055: this step deliberately runs WITHOUT a real UCI root, so no
      # real-UCI code is generated. The second, real-UCI generated-code compile
      # (PositionReport, SubsystemStream) under 1.95.0 is Deep CI job
      # msrv-real-uci.
      - name: Rust LA-CAL runtime MSRV (1.95.0, local/synthetic)
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 --version
          cargo +1.95.0 check --locked -p ams-gra-oms-runtime-api
          cargo +1.95.0 check --locked -p ams-gra-oms-runtime-rust --all-targets
          cargo +1.95.0 check --locked -p ams-gra-oms-runtime-rust-facade-tests --all-targets
      # Tasks 049-053 runtime against the UNMODIFIED pinned Sleet server and
      # the real UCI 2.5 PositionReport / SubsystemStream codecs: moved to Deep
      # CI (deep-ci.yml, job real-sleet) by Task 055.
      # Task 055: structural guard for this split. Fast CI must never fetch
      # real UCI or build Sleet, and Deep CI must keep every moved check.
      - name: Fast/Deep CI split guard (Task 055)
        run: |
          set -euo pipefail
          scripts/check-ci-split.sh
          scripts/test-check-ci-split.sh
          python3 scripts/test-task060-ci-wrappers.py
          python3 scripts/test-task061-ci-wrappers.py
      # `AMS_GRA_REQUIRE_GNAT` turns the Ada probes' developer-machine skip
      # into a hard failure, so a runner that somehow lost GNAT after the gate
      # above cannot produce a green run with the Ada checks quietly elided.
      - run: cargo test --workspace
        env:
          AMS_GRA_REQUIRE_GNAT: "1"
