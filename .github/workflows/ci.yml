            cargo test -p ams-gra-oms-runtime-rust-facade-tests --test generated_codec_mock_owp \
            task053_constrained_binary_round_trips_through_mock_owp
          output="$(cargo test -p ams-gra-oms-backend-ada --test constrained_binary -- \
            --exact task053_ada_constrained_binary_runtime_lifecycle_and_storage --nocapture 2>&1)"
          printf '%s\n' "$output"
          test "$(printf '%s\n' "$output" | grep -c 'ADA CONSTRAINED BINARY RUNTIME: PASSED')" = 2
      # Task 053 real-UCI constrained-Binary inventory / message impact: moved
      # to Deep CI (deep-ci.yml, job real-uci) by Task 055.
      # Task 054: reserved Record-field / Choice-alternative identifiers are
      # remapped with the fixed Field_ / Alternative_ escape; malformed names
      # and post-remap collisions still fail closed; the codec keeps source
      # wire names.
      - name: Member identifier remapping (Task 054, must execute)
        env:
          AMS_GRA_REQUIRE_GNAT: "1"
        run: |
          set -euo pipefail
