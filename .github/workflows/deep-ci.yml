name: Deep CI

# Task 055 evidence is preserved. CI-SELECT-002 selects individual jobs for
# verified PR changes; main, nightly and manual qualification remain complete.
# Nightly and manual qualification remain available; no duplicate push run.
# See docs/ci-select-001-change-aware-qualification.md.
on:
  workflow_call:
    inputs:
      selection:
        description: Verified canonical v2 CI selection manifest; empty only for direct full qualification
        type: string
        required: false
        default: ''
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# CI caller owns PR cancellation; no main cancellation group here.

jobs:
  ada-real-uci-dlz-sleet:
    if: github.event_name != 'pull_request' || inputs.selection == '' || fromJSON(inputs.selection).version != 2 || contains(fromJSON(inputs.selection).deep_jobs, 'ada-real-uci-dlz-sleet')
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && format('oms-main-slot-{0}', matrix.slot) || format('oms-pr-{0}-{1}-{2}-deep-ci.yml-ada-real-uci-dlz-sleet-{3}', github.workflow, github.run_id, github.run_attempt, matrix.compiler) }}
      queue: max
    name: ada-real-uci-dlz-sleet (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: ['14', '16']
        include:
          - compiler: '14'
            slot: 3
          - compiler: '16'
            slot: 5
    container:
      image: debian@sha256:bcf83fd8af414eda0c0a99d25a4e61dedd88e7aac7f7bc519d04555ff0c40ec5
    timeout-minutes: 120
    steps:
      - name: Verify pinned target and external compiler
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates curl unzip git python3 make gcc g++ gnat gnat-14
          test "$(uname -m)" = x86_64
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.41'
          mkdir -p /tmp/task101-evidence
          dpkg-query -W libc6 libc6-dev gnat-14 gcc-14 | tee /tmp/task101-evidence/platform.txt
          sha256sum /usr/lib/x86_64-linux-gnu/libc.so.6 /usr/bin/gnat /usr/bin/gcc | tee -a /tmp/task101-evidence/platform.txt
          gnat --version | tee -a /tmp/task101-evidence/platform.txt
          gnat --version | grep -E '^GNAT 14\.2\.0([[:space:]]|$)'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(pwd -P)" = "$(realpath "$GITHUB_WORKSPACE")"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD 'HEAD^{tree}' | tee /tmp/task101-evidence/source.txt
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          status="$(git status --porcelain)"
          test -z "$status"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install verified Alire 2.1.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          echo '09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  /tmp/alire.zip' | sha256sum --check --strict
          unzip -q /tmp/alire.zip -d /opt/alire
          test "$(/opt/alire/bin/alr --version)" = 'alr 2.1.1'
          sha256sum /opt/alire/bin/alr | tee -a /tmp/task101-evidence/platform.txt
          echo /opt/alire/bin >> "$GITHUB_PATH"
      - name: Build source-bound generator
        run: cargo +1.95.0 build --release --locked -p ams-gra-codegen-oms
      - name: Provision pinned compiler and GNATCOLL inputs
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/task096/setup.py --scratch /tmp/task101-evidence/setup --compiler '${{ matrix.compiler }}'
      - name: Build unmodified pinned Sleet
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/open-arsenal/ams-gra-hello-world-sk-infra-sleet /tmp/task101-sleet
          git -C /tmp/task101-sleet checkout --quiet --detach e38f61d8ce0d75c8508434a52f2ed77c69cf6a3b
          test "$(git -C /tmp/task101-sleet rev-parse HEAD)" = e38f61d8ce0d75c8508434a52f2ed77c69cf6a3b
          test -z "$(git -C /tmp/task101-sleet status --porcelain)"
          git -C /tmp/task101-sleet rev-parse HEAD 'HEAD^{tree}' | tee /tmp/task101-evidence/sleet-source.txt
          (cd /tmp/task101-sleet && cargo build --release --locked -p sleet) 2>&1 | tee /tmp/task101-evidence/sleet-build.log
      - name: Fetch authentic pinned UCI releases and protocol client
        shell: bash
        run: |
          set -euo pipefail
          apt-get install --no-install-recommends -y python3-venv
          bash scripts/fetch-pinned-uci-2.5.sh /tmp/task101-uci25 > /tmp/task101-evidence/uci25-root.txt
          bash scripts/fetch-pinned-uci-2.6.sh /tmp/task101-uci26 > /tmp/task101-evidence/uci26-root.txt
          python3 -m venv /tmp/task101-venv
          /tmp/task101-venv/bin/pip install 'websockets==17.2'
      - name: Execute actual Ada DLZ against pinned Sleet
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          /tmp/task101-venv/bin/python scripts/task101/qualify.py \
            --scratch /tmp/task101-evidence/campaign --setup /tmp/task101-evidence/setup \
            --compiler '${{ matrix.compiler }}' --generator target/release/ams-gra-codegen-oms \
            --sleet /tmp/task101-sleet \
            --uci25 "$(cat /tmp/task101-evidence/uci25-root.txt)" \
            --uci26 "$(cat /tmp/task101-evidence/uci26-root.txt)" \
            | tee /tmp/task101-evidence/qualify.log
      - name: Record Task101 source-bound integration identity
        shell: bash
        env:
          TASK101_COMPILER: ${{ matrix.compiler }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          from pathlib import Path
          git = lambda ref: subprocess.check_output(['git', 'rev-parse', ref], text=True).strip()
          sha = git('HEAD')
          if sha != os.environ['GITHUB_SHA']:
              raise SystemExit('Task101 source is not workflow source')
          Path('/tmp/task101-evidence/integration-identity.json').write_text(json.dumps(dict(
              sha=sha, tree=git('HEAD^{tree}'), run_id=os.environ['GITHUB_RUN_ID'],
              run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], compiler=os.environ['TASK101_COMPILER'])) + '\n')
          EOF
      - name: Independently verify every mandatory Task101 cell
        shell: bash
        env:
          TASK101_COMPILER: ${{ matrix.compiler }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'EOF'
          import os, sys, subprocess
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from task101_evidence import verify_bundle
          root = Path('/tmp/task101-evidence')
          files = {str(p.relative_to(root)): p.read_bytes() for p in root.rglob('*')
                   if p.is_file() and p.suffix in {'.json', '.txt', '.log', '.stdout', '.stderr', '.exit',
                                                  '.sha256', '.ads', '.adb', '.gpr', '.adc', '.xsd', '.yaml'}}
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          print('TASK101_HOSTED_VERIFIED', verify_bundle(files, os.environ['TASK101_COMPILER'],
                os.environ['GITHUB_SHA'], tree, os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']))
          EOF
      - name: Preserve Task101 mandatory source and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task101-ada-real-uci-dlz-${{ matrix.compiler }}
          path: |
            /tmp/task101-evidence/*.json
            /tmp/task101-evidence/*.txt
            /tmp/task101-evidence/*.log
            /tmp/task101-evidence/setup/step-*
            /tmp/task101-evidence/setup/identities.json
            /tmp/task101-evidence/campaign/**/*.json
            /tmp/task101-evidence/campaign/**/*.txt
            /tmp/task101-evidence/campaign/**/*.stdout
            /tmp/task101-evidence/campaign/**/*.stderr
            /tmp/task101-evidence/campaign/**/*.exit
            /tmp/task101-evidence/campaign/**/*.sha256
            /tmp/task101-evidence/campaign/**/*.ad?
            /tmp/task101-evidence/campaign/**/*.gpr
            /tmp/task101-evidence/campaign/**/*.xsd
            /tmp/task101-evidence/campaign/**/*.yaml
          if-no-files-found: error

  ada-websocket-real-sleet:
    if: github.event_name != 'pull_request' || inputs.selection == '' || fromJSON(inputs.selection).version != 2 || contains(fromJSON(inputs.selection).deep_jobs, 'ada-websocket-real-sleet')
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && format('oms-main-slot-{0}', matrix.slot) || format('oms-pr-{0}-{1}-{2}-deep-ci.yml-ada-websocket-real-sleet-{3}', github.workflow, github.run_id, github.run_attempt, matrix.compiler) }}
      queue: max
    name: ada-websocket-real-sleet (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: ['14', '16']
        include:
          - compiler: '14'
            slot: 4
          - compiler: '16'
            slot: 2
    container:
      image: debian@sha256:bcf83fd8af414eda0c0a99d25a4e61dedd88e7aac7f7bc519d04555ff0c40ec5
    timeout-minutes: 120
    steps:
      - name: Verify pinned target and external compiler
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates curl unzip git python3 make gcc g++ gnat gnat-14
          test "$(uname -m)" = x86_64
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.41'
          mkdir -p /tmp/task100-evidence
          dpkg-query -W libc6 libc6-dev gnat-14 gcc-14 | tee /tmp/task100-evidence/platform.txt
          sha256sum /usr/lib/x86_64-linux-gnu/libc.so.6 /usr/bin/gnat /usr/bin/gcc | tee -a /tmp/task100-evidence/platform.txt
          gnat --version | tee -a /tmp/task100-evidence/platform.txt
          gnat --version | grep -E '^GNAT 14\.2\.0([[:space:]]|$)'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(pwd -P)" = "$(realpath "$GITHUB_WORKSPACE")"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD 'HEAD^{tree}' | tee /tmp/task100-evidence/source.txt
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          status="$(git status --porcelain)"
          test -z "$status"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install verified Alire 2.1.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          echo '09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  /tmp/alire.zip' | sha256sum --check --strict
          unzip -q /tmp/alire.zip -d /opt/alire
          test "$(/opt/alire/bin/alr --version)" = 'alr 2.1.1'
          sha256sum /opt/alire/bin/alr | tee -a /tmp/task100-evidence/platform.txt
          echo /opt/alire/bin >> "$GITHUB_PATH"
      - name: Build exact-head generator
        run: cargo +1.95.0 build --locked -p ams-gra-codegen-oms
      - name: Provision pinned compiler and GNATCOLL inputs
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/task096/setup.py --scratch /tmp/task100-evidence/setup --compiler '${{ matrix.compiler }}'
      - name: Build unmodified pinned Sleet
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/open-arsenal/ams-gra-hello-world-sk-infra-sleet /tmp/task100-sleet
          git -C /tmp/task100-sleet checkout --quiet --detach e38f61d8ce0d75c8508434a52f2ed77c69cf6a3b
          test "$(git -C /tmp/task100-sleet rev-parse HEAD)" = e38f61d8ce0d75c8508434a52f2ed77c69cf6a3b
          test -z "$(git -C /tmp/task100-sleet status --porcelain)"
          git -C /tmp/task100-sleet rev-parse HEAD 'HEAD^{tree}' | tee /tmp/task100-evidence/sleet-source.txt
          (cd /tmp/task100-sleet && cargo build --release --locked -p sleet) 2>&1 | tee /tmp/task100-evidence/sleet-build.log
      - name: Execute generated runtime consumers and require all cells
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 scripts/task100/qualify.py --scratch /tmp/task100-evidence/campaign --setup /tmp/task100-evidence/setup --compiler '${{ matrix.compiler }}' --generator "$GITHUB_WORKSPACE/target/debug/ams-gra-codegen-oms" --sleet /tmp/task100-sleet | tee /tmp/task100-evidence/qualify.log
          python3 - <<'EOF'
          import json
          result = json.load(open('/tmp/task100-evidence/campaign/result.json'))
          cells = result['cells']
          expected = {(n, p, a, o) for n in ['oam', 'qualified'] for p in ['portable', 'lossless']
                      for a in ['Normal', 'Check', 'Ignore'] for o in ['0', '2']}
          actual = {(c['namespace'], c['profile'], c['policy'], c['optimization']) for c in cells}
          if not result.get('completed') or len(cells) != 24 or actual != expected:
              raise SystemExit('incomplete Task 100 execution matrix')
          if any(s['exit'] != 0 for s in result['steps']):
              raise SystemExit('failed Task 100 step')
          if not result.get('real_sleet'):
              raise SystemExit('real Sleet not requested')
          from pathlib import Path
          evidence = list(Path('/tmp/task100-evidence/campaign').glob('oam-portable-*/sleet/result.json'))
          if len(evidence) != 6 or any(not json.loads(p.read_text()).get('completed') for p in evidence):
              raise SystemExit('missing real pinned Sleet execution')
          print('TASK100_HOSTED_REQUIRED_CELLS', len(cells))
          EOF
          test "$(grep -c '^TASK100_CELL_COMPLETE ' /tmp/task100-evidence/qualify.log)" = 24
          grep -F 'TASK100_QUALIFICATION_COMPLETE' /tmp/task100-evidence/qualify.log
      - name: Record Task100 integration run identity
        shell: bash
        env:
          TASK100_COMPILER: ${{ matrix.compiler }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          from pathlib import Path
          git = lambda ref: subprocess.check_output(['git', 'rev-parse', ref], text=True).strip()
          sha = git('HEAD')
          if sha != os.environ['GITHUB_SHA']:
              raise SystemExit('Task100 source is not qualified workflow source')
          Path('/tmp/task100-evidence/integration-identity.json').write_text(json.dumps(dict(
              sha=sha, tree=git('HEAD^{tree}'), run_id=os.environ['GITHUB_RUN_ID'],
              run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], compiler=os.environ['TASK100_COMPILER'])) + '\n')
          EOF
      - name: Upload mandatory source compiler and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task100-ada-websocket-sleet-${{ matrix.compiler }}
          path: |
            scripts/task100/**
            tests/ada-websocket/**
            tests/fixtures/service-generate/lacal-websocket.xsd
            tests/fixtures/service-generate/lacal-runtime.yaml
            /tmp/task100-evidence/*.txt
            /tmp/task100-evidence/integration-identity.json
            /tmp/task100-evidence/*.log
            /tmp/task100-evidence/setup/step-*
            /tmp/task100-evidence/setup/identities.json
            /tmp/task100-evidence/setup/consumer/alire/alire.lock
            /tmp/task100-evidence/campaign/**/*.json
            /tmp/task100-evidence/campaign/**/*.txt
            /tmp/task100-evidence/campaign/**/*.stdout
            /tmp/task100-evidence/campaign/**/*.stderr
            /tmp/task100-evidence/campaign/**/*.exit
            /tmp/task100-evidence/campaign/**/*.ad?
            /tmp/task100-evidence/campaign/**/*.gpr
            /tmp/task100-evidence/campaign/**/*.adc
            /tmp/task100-evidence/campaign/**/*.c
            /tmp/task100-evidence/campaign/**/*.h
            /tmp/task100-evidence/campaign/**/*.lock
            /tmp/task100-evidence/campaign/**/*.xsd
            /tmp/task100-evidence/campaign/**/*.toml
            /tmp/task100-evidence/campaign/**/LICENSE
            /tmp/task100-evidence/campaign/**/*.sha256
          if-no-files-found: error

  ada-repeated-choice-real-uci:
    if: github.event_name != 'pull_request' || inputs.selection == '' || fromJSON(inputs.selection).version != 2 || contains(fromJSON(inputs.selection).deep_jobs, 'ada-repeated-choice-real-uci')
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'oms-main-slot-5' || format('oms-pr-{0}-{1}-{2}-deep-ci.yml-ada-repeated-choice-real-uci', github.workflow, github.run_id, github.run_attempt) }}
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify Deep CI source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$actual" = "$GITHUB_SHA"
          test -n "$tree"
          printf 'DEEP_CI_SOURCE_SHA=%s\n' "$actual"
          printf 'DEEP_CI_SOURCE_TREE=%s\n' "$tree"
          printf 'DEEP_CI_EVENT=%s\n' "$GITHUB_EVENT_NAME"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install verified Alire 2.1.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task092-tools"
          cd "$RUNNER_TEMP/task092-tools"
          curl --fail --location --retry 3 --output alire.zip \
            https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          echo '09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  alire.zip' | sha256sum --check --strict
          unzip -q alire.zip
          test "$(bin/alr --version)" = 'alr 2.1.1'
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Build production generator
        run: cargo build --release --locked -p ams-gra-codegen-oms
      - name: Fetch unchanged hash-verified pinned UCI roots
        shell: bash
        run: |
          set -euo pipefail
          UCI25="$(scripts/fetch-pinned-uci-2.5.sh "$RUNNER_TEMP/task092-uci25")"
          UCI26="$(scripts/fetch-pinned-uci-2.6.sh "$RUNNER_TEMP/task092-uci26")"
          echo "TASK092_UCI25=$UCI25" >> "$GITHUB_ENV"
          echo "TASK092_UCI26=$UCI26" >> "$GITHUB_ENV"
      - name: Execute real UCI repeated Choice typed consumers
        run: python3 scripts/check-task092-real.py --compiler 16 --generator "$GITHUB_WORKSPACE/target/release/ams-gra-codegen-oms" --scratch "$RUNNER_TEMP/task092-real" --uci25 "$TASK092_UCI25" --uci26 "$TASK092_UCI26"
      - name: Require real qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          for selection in 25-rdma 26-rdma 25-survivability; do
            test -s "$RUNNER_TEMP/task092-real/$selection/sources.sha256"
            for policy in normal Check Ignore; do
              test -s "$RUNNER_TEMP/task092-real/$selection/$policy-alire.lock"
              test -s "$RUNNER_TEMP/task092-real/$selection/$policy-run.log"
            done
          done
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task092-real-uci-repeated-choice
          path: ${{ runner.temp }}/task092-real/**
          if-no-files-found: error
  # Tasks 052/053/054 on the REAL pinned UCI 2.5 and 2.6 roots. GNAT is
  # installed here because the Task 054 real category-A test compiles the
  # generated Ada (gnatmake -gnatc) and AMS_GRA_REQUIRE_GNAT forbids a skip.
  # PERF-007: three independent hosted runners; unchanged seven task bodies.
  real-uci-temporal-naming:
    if: github.event_name != 'pull_request' || inputs.selection == '' || fromJSON(inputs.selection).version != 2 || contains(fromJSON(inputs.selection).deep_jobs, 'real-uci-temporal-naming')
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'oms-main-slot-4' || format('oms-pr-{0}-{1}-{2}-deep-ci.yml-real-uci-temporal-naming', github.workflow, github.run_id, github.run_attempt) }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify Deep CI source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$actual" = "$GITHUB_SHA"
          test -n "$tree"
          printf 'DEEP_CI_SOURCE_SHA=%s\n' "$actual"
          printf 'DEEP_CI_SOURCE_TREE=%s\n' "$tree"
          printf 'DEEP_CI_EVENT=%s\n' "$GITHUB_EVENT_NAME"
      - name: Initialize private shard evidence
        run: python3 scripts/real_uci_evidence.py init
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GNAT
        shell: python3 scripts/real_uci_evidence.py setup gnat {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat
      # Hard gate, as in Fast CI: no `|| true`.
      - name: Verify GNAT availability
        run: |
          command -v gnatmake
          gnatmake --version
      # Fetch each pinned release ONCE for the whole job. Both scripts verify
      # the tag revision and root SHA-256 and fail hard on any mismatch; the
      # tests verify the root SHA-256 again before using it.
      - name: Fetch pinned UCI 2.5 and 2.6 (once)
        shell: python3 scripts/real_uci_evidence.py setup fetch {0}
        run: |
          set -euo pipefail
          UCI25="$(scripts/fetch-pinned-uci-2.5.sh "$RUNNER_TEMP/uci-2.5")"
          UCI26="$(scripts/fetch-pinned-uci-2.6.sh "$RUNNER_TEMP/uci-2.6")"
          echo "AMS_GRA_UCI_2_5_ROOT=$UCI25" >> "$GITHUB_ENV"
          echo "AMS_GRA_UCI_2_6_ROOT=$UCI26" >> "$GITHUB_ENV"
      - name: Prepare independent locked release generator
        shell: python3 scripts/real_uci_evidence.py setup build {0}
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo build --release --locked -p ams-gra-codegen-oms
      - name: Record verified pinned and toolchain identities
        run: python3 scripts/real_uci_evidence.py inputs
      - name: Named TimeZulu pinned inventory and impact (Task 061)
        shell: python3 scripts/real_uci_evidence.py task 061 {0}
        run: bash scripts/check-task061-pinned.sh
      - name: Real UCI route identity smoke (Task 071)
        shell: python3 scripts/real_uci_evidence.py task 071 {0}
        run: bash scripts/check-task071-uci.sh
      - name: Ada semantic companion naming and smallest real vertical (Task 065)
        shell: python3 scripts/real_uci_evidence.py task 065 {0}
        run: bash scripts/check-task065-pinned.sh
      - name: Reconcile complete shard evidence
        if: always()
        run: python3 scripts/real_uci_evidence.py finish
      - name: Preserve mandatory shard evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
