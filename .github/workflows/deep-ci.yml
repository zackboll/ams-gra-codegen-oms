name: Deep CI

# Task 055: slow external/reference evidence, moved OFF the pull-request
# critical path. Nothing here was deleted or weakened; it runs after merge.
#
#   push to main       -> hard, visible post-merge signal on every merge
#   nightly 06:00 UTC  -> environment / toolchain drift signal
#   workflow_dispatch  -> manual investigation
#   pull_request       -> ONLY when the CI harness itself changes (workflow
#                         files or the deep-only scripts), so a PR that edits
#                         this evidence also exercises it. Ordinary source PRs
#                         do not match these paths and do not run Deep CI.
#
# See docs/task-055-ci-fast-deep-split.md.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/fetch-pinned-uci-2.5.sh"
      - "scripts/fetch-pinned-uci-2.6.sh"
      - "scripts/run-real-sleet-test.sh"
      - "scripts/task100/**"
      - "tests/ada-websocket/**"
      - "ada/oms-lacal-runtime/**"
      - "tests/fixtures/service-generate/lacal-websocket.xsd"
      - "python/oms-lacal-runtime/**"
      - "scripts/check-py005-sleet.sh"
      - "scripts/check-py006-sleet.sh"
      - "scripts/check-py006-uci.py"
      - "tests/fixtures/python-header-profiles/**"
      - "tests/fixtures/python-runtime/**"
      - "crates/runtime-rust-facade-tests/tests/task077_sleet.rs"
      - "scripts/check-task062-pinned.sh"
      - "scripts/check-task061-service-impact.py"
      - "scripts/test-task061-service-impact.py"
      - "scripts/check-task062-service-impact.py"
      - "scripts/check-task062-vertical.py"
      - "scripts/check-task063-pinned.sh"
      - "scripts/check-task063-service-impact.py"
      - "scripts/check-task065-pinned.sh"
      - "scripts/check-task066-pinned.sh"
      - "scripts/check-task066-vertical.py"
      - "scripts/check-task069-pinned.sh"

permissions:
  contents: read

# If A and B merge to main while A's deep run is still going, B contains A and
# is the more useful target, so the obsolete run is cancelled. PR validation
# runs use refs/pull/N/merge and so never cancel main (or each other).
concurrency:
  group: deep-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ada-websocket-real-sleet:
    # Task 100: unmodified pinned broker; exact PR head, never merge-ref evidence.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: ['14', '16']
    container:
      image: debian@sha256:bcf83fd8af414eda0c0a99d25a4e61dedd88e7aac7f7bc519d04555ff0c40ec5
    timeout-minutes: 120
    steps:
      - name: Verify pinned target and external compiler
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates curl unzip git python3 make gcc g++ gnat gnat-14
          test "$(uname -m)" = x86_64
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.41'
          mkdir -p /tmp/task100-evidence
          dpkg-query -W libc6 libc6-dev gnat-14 gcc-14 | tee /tmp/task100-evidence/platform.txt
          sha256sum /usr/lib/x86_64-linux-gnu/libc.so.6 /usr/bin/gnat /usr/bin/gcc | tee -a /tmp/task100-evidence/platform.txt
          gnat --version | tee -a /tmp/task100-evidence/platform.txt
          gnat --version | grep -E '^GNAT 14\.2\.0([[:space:]]|$)'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(pwd -P)" = "$(realpath "$GITHUB_WORKSPACE")"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD 'HEAD^{tree}' | tee /tmp/task100-evidence/source.txt
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          status="$(git status --porcelain)"
          test -z "$status"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install verified Alire 2.1.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          echo '09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  /tmp/alire.zip' | sha256sum --check --strict
          unzip -q /tmp/alire.zip -d /opt/alire
          test "$(/opt/alire/bin/alr --version)" = 'alr 2.1.1'
          sha256sum /opt/alire/bin/alr | tee -a /tmp/task100-evidence/platform.txt
          echo /opt/alire/bin >> "$GITHUB_PATH"
      - name: Build exact-head generator
        run: cargo +1.95.0 build --locked -p ams-gra-codegen-oms
      - name: Provision pinned compiler and GNATCOLL inputs
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/task096/setup.py --scratch /tmp/task100-evidence/setup --compiler '${{ matrix.compiler }}'
      - name: Build unmodified pinned Sleet
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/open-arsenal/ams-gra-hello-world-sk-infra-sleet /tmp/task100-sleet
          git -C /tmp/task100-sleet checkout --quiet --detach e38f61d8ce0d75c8508434a52f2ed77c69cf6a3b
          test "$(git -C /tmp/task100-sleet rev-parse HEAD)" = e38f61d8ce0d75c8508434a52f2ed77c69cf6a3b
          test -z "$(git -C /tmp/task100-sleet status --porcelain)"
          git -C /tmp/task100-sleet rev-parse HEAD 'HEAD^{tree}' | tee /tmp/task100-evidence/sleet-source.txt
          (cd /tmp/task100-sleet && cargo build --release --locked -p sleet) 2>&1 | tee /tmp/task100-evidence/sleet-build.log
      - name: Execute generated runtime consumers and require all cells
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 scripts/task100/qualify.py --scratch /tmp/task100-evidence/campaign --setup /tmp/task100-evidence/setup --compiler '${{ matrix.compiler }}' --generator "$GITHUB_WORKSPACE/target/debug/ams-gra-codegen-oms" --sleet /tmp/task100-sleet | tee /tmp/task100-evidence/qualify.log
          python3 - <<'EOF'
          import json
          result = json.load(open('/tmp/task100-evidence/campaign/result.json'))
          cells = result['cells']
          expected = {(n, p, a, o) for n in ['oam', 'qualified'] for p in ['portable', 'lossless']
                      for a in ['Normal', 'Check', 'Ignore'] for o in ['0', '2']}
          actual = {(c['namespace'], c['profile'], c['policy'], c['optimization']) for c in cells}
          if not result.get('completed') or len(cells) != 24 or actual != expected:
              raise SystemExit('incomplete Task 100 execution matrix')
          if any(s['exit'] != 0 for s in result['steps']):
              raise SystemExit('failed Task 100 step')
          if not result.get('real_sleet'):
              raise SystemExit('real Sleet not requested')
          from pathlib import Path
          evidence = list(Path('/tmp/task100-evidence/campaign').glob('oam-portable-*/sleet/result.json'))
          if len(evidence) != 6 or any(not json.loads(p.read_text()).get('completed') for p in evidence):
              raise SystemExit('missing real pinned Sleet execution')
          print('TASK100_HOSTED_REQUIRED_CELLS', len(cells))
          EOF
          test "$(grep -c '^TASK100_CELL_COMPLETE ' /tmp/task100-evidence/qualify.log)" = 24
          grep -F 'TASK100_QUALIFICATION_COMPLETE' /tmp/task100-evidence/qualify.log
      - name: Upload mandatory source compiler and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task100-ada-websocket-sleet-${{ matrix.compiler }}
          path: |
            /tmp/task100-evidence/*.txt
            /tmp/task100-evidence/*.log
            /tmp/task100-evidence/setup/step-*
            /tmp/task100-evidence/setup/identities.json
            /tmp/task100-evidence/setup/consumer/alire/alire.lock
            /tmp/task100-evidence/campaign/**/*.json
            /tmp/task100-evidence/campaign/**/*.stdout
            /tmp/task100-evidence/campaign/**/*.stderr
            /tmp/task100-evidence/campaign/**/*.exit
            /tmp/task100-evidence/campaign/**/*.ad?
            /tmp/task100-evidence/campaign/**/*.gpr
            /tmp/task100-evidence/campaign/**/*.adc
            /tmp/task100-evidence/campaign/**/*.c
            /tmp/task100-evidence/campaign/**/*.h
            /tmp/task100-evidence/campaign/**/*.lock
            /tmp/task100-evidence/campaign/**/*.xsd
            /tmp/task100-evidence/campaign/**/*.toml
            /tmp/task100-evidence/campaign/**/LICENSE
          if-no-files-found: error
  ada-repeated-choice-real-uci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify Deep CI source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$actual" = "$GITHUB_SHA"
          test -n "$tree"
          printf 'DEEP_CI_SOURCE_SHA=%s\n' "$actual"
          printf 'DEEP_CI_SOURCE_TREE=%s\n' "$tree"
          printf 'DEEP_CI_EVENT=%s\n' "$GITHUB_EVENT_NAME"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install verified Alire 2.1.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task092-tools"
          cd "$RUNNER_TEMP/task092-tools"
          curl --fail --location --retry 3 --output alire.zip \
            https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          echo '09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  alire.zip' | sha256sum --check --strict
          unzip -q alire.zip
          test "$(bin/alr --version)" = 'alr 2.1.1'
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Build production generator
        run: cargo build --release --locked -p ams-gra-codegen-oms
      - name: Fetch unchanged hash-verified pinned UCI roots
        shell: bash
        run: |
          set -euo pipefail
          UCI25="$(scripts/fetch-pinned-uci-2.5.sh "$RUNNER_TEMP/task092-uci25")"
          UCI26="$(scripts/fetch-pinned-uci-2.6.sh "$RUNNER_TEMP/task092-uci26")"
          echo "TASK092_UCI25=$UCI25" >> "$GITHUB_ENV"
          echo "TASK092_UCI26=$UCI26" >> "$GITHUB_ENV"
      - name: Execute real UCI repeated Choice typed consumers
        run: python3 scripts/check-task092-real.py --compiler 16 --generator "$GITHUB_WORKSPACE/target/release/ams-gra-codegen-oms" --scratch "$RUNNER_TEMP/task092-real" --uci25 "$TASK092_UCI25" --uci26 "$TASK092_UCI26"
      - name: Require real qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          for selection in 25-rdma 26-rdma 25-survivability; do
            test -s "$RUNNER_TEMP/task092-real/$selection/sources.sha256"
            for policy in normal Check Ignore; do
              test -s "$RUNNER_TEMP/task092-real/$selection/$policy-alire.lock"
              test -s "$RUNNER_TEMP/task092-real/$selection/$policy-run.log"
            done
          done
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task092-real-uci-repeated-choice
          path: ${{ runner.temp }}/task092-real/**
          if-no-files-found: error
  # Tasks 052/053/054 on the REAL pinned UCI 2.5 and 2.6 roots. GNAT is
  # installed here because the Task 054 real category-A test compiles the
  # generated Ada (gnatmake -gnatc) and AMS_GRA_REQUIRE_GNAT forbids a skip.
  real-uci:
    runs-on: ubuntu-latest
    # Task 077B: first seven qualification gates; regressions have their own
    # independent four-hour budget. No payload gate is repeated.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify Deep CI source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$actual" = "$GITHUB_SHA"
          test -n "$tree"
          printf 'DEEP_CI_SOURCE_SHA=%s\n' "$actual"
          printf 'DEEP_CI_SOURCE_TREE=%s\n' "$tree"
          printf 'DEEP_CI_EVENT=%s\n' "$GITHUB_EVENT_NAME"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GNAT
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat
      # Hard gate, as in Fast CI: no `|| true`.
      - name: Verify GNAT availability
        run: |
          command -v gnatmake
          gnatmake --version
      # Fetch each pinned release ONCE for the whole job. Both scripts verify
      # the tag revision and root SHA-256 and fail hard on any mismatch; the
      # tests verify the root SHA-256 again before using it.
      - name: Fetch pinned UCI 2.5 and 2.6 (once)
        run: |
          set -euo pipefail
          UCI25="$(scripts/fetch-pinned-uci-2.5.sh "$RUNNER_TEMP/uci-2.5")"
          UCI26="$(scripts/fetch-pinned-uci-2.6.sh "$RUNNER_TEMP/uci-2.6")"
          echo "AMS_GRA_UCI_2_5_ROOT=$UCI25" >> "$GITHUB_ENV"
          echo "AMS_GRA_UCI_2_6_ROOT=$UCI26" >> "$GITHUB_ENV"
      # Marker checks below use here-strings, never `printf | grep -q`: under
      # pipefail a grep that exits on its first match can SIGPIPE a writer that
      # is still emitting a large output and fail a passing check.
      #
      - name: Named TimeZulu pinned inventory and impact (Task 061)
        run: bash scripts/check-task061-pinned.sh
      - name: Real UCI route identity smoke (Task 071)
        run: bash scripts/check-task071-uci.sh
      - name: Pinned semantic schema diff (Task 069, once for both releases)
        run: bash scripts/check-task069-pinned.sh
      - name: Exact IPv6 pinned inventory, impact and real vertical (Task 062)
        run: bash scripts/check-task062-pinned.sh
      - name: Exact patterned integral pinned evidence (Task 063)
        run: bash scripts/check-task063-pinned.sh
      - name: Ada semantic companion naming and smallest real vertical (Task 065)
        run: bash scripts/check-task065-pinned.sh
      - name: Unicode 3.1 pinned profiles, impact and real vertical (Task 066)
        run: bash scripts/check-task066-pinned.sh

  # Independent runner: no artifacts or environment inherited from real-uci.
  real-uci-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify Deep CI source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$actual" = "$GITHUB_SHA"
          test -n "$tree"
          printf 'DEEP_CI_SOURCE_SHA=%s\n' "$actual"
          printf 'DEEP_CI_SOURCE_TREE=%s\n' "$tree"
          printf 'DEEP_CI_EVENT=%s\n' "$GITHUB_EVENT_NAME"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GNAT
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat
      # Hard gate, as in Fast CI: no `|| true`.
      - name: Verify GNAT availability
        run: |
          command -v gnatmake
          gnatmake --version
      # Fetch each pinned release ONCE for the whole job. Both scripts verify
      # the tag revision and root SHA-256 and fail hard on any mismatch; the
      # tests verify the root SHA-256 again before using it.
      - name: Fetch pinned UCI 2.5 and 2.6 (once)
        run: |
          set -euo pipefail
          UCI25="$(scripts/fetch-pinned-uci-2.5.sh "$RUNNER_TEMP/uci-2.5")"
          UCI26="$(scripts/fetch-pinned-uci-2.6.sh "$RUNNER_TEMP/uci-2.6")"
          echo "AMS_GRA_UCI_2_5_ROOT=$UCI25" >> "$GITHUB_ENV"
          echo "AMS_GRA_UCI_2_6_ROOT=$UCI26" >> "$GITHUB_ENV"
      - name: Prepare regression inputs and release CLI
        run: |
          set -euo pipefail
          test -n "$AMS_GRA_UCI_2_5_ROOT"
          test -n "$AMS_GRA_UCI_2_6_ROOT"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          cargo fetch --locked
          cargo build --release --locked -p ams-gra-codegen-oms
      - name: Qualify batch transport and production equivalence controls
        run: |
          set -euo pipefail
          python3 scripts/test-task061-service-impact.py
          cargo test --release --locked -p ams-gra-codegen-oms --test service_check_batch
      - name: Python exact header profiles against pinned UCI (PY-006, must execute)
        run: |
          set -euo pipefail
          python3 scripts/check-py006-uci.py --generator target/release/ams-gra-codegen-oms \
            --output "$RUNNER_TEMP/py006-uci"
      - name: Preserve Python pinned UCI measurements
        uses: actions/upload-artifact@v4
        with:
          name: py006-uci
          path: ${{ runner.temp }}/py006-uci/**
          if-no-files-found: error
      - name: Confirm unique newly READY Time services (Task 061)
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          python3 scripts/check-task061-service-impact.py target/release/ams-gra-codegen-oms
      - name: Preserve Task 061 per-selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task061-service-check
          path: ${{ runner.temp }}/task061-service-check-*/**
          if-no-files-found: error
      # Task 052: every Binary must resolve to HexBinary through the shared IR
      # query, with exact counts.
      - name: Real UCI Binary provenance inventory (Task 052, must execute)
        run: |
          set -euo pipefail
          status=0
          output="$(cargo test --release -p ams-gra-oms-xsd-frontend --test uci_binary_provenance -- \
            --nocapture --test-threads 1 2>&1)" || status=$?
          printf '%s\n' "$output"
          if (( status != 0 )); then exit "$status"; fi
          grep -Fqx 'UCI 2.5 BINARY PROVENANCE INVENTORY: PASSED' <<<"$output"
          grep -Fqx 'UCI 2.6 BINARY PROVENANCE INVENTORY: PASSED' <<<"$output"
          grep -qE '^test result: ok\. 2 passed' <<<"$output"
      # Task 053: constrained-Binary inventory, per-declaration rendering in all
      # three backends, and message-closure impact.
      - name: Real UCI constrained Binary inventory (Task 053, must execute)
        run: |
          set -euo pipefail
          status=0
          output="$(cargo test --release -p ams-gra-codegen-oms --test uci_constrained_binary -- \
            --nocapture --test-threads 1 2>&1)" || status=$?
          printf '%s\n' "$output"
          if (( status != 0 )); then exit "$status"; fi
          grep -Fqx 'UCI 2.5 CONSTRAINED BINARY INVENTORY: PASSED' <<<"$output"
          grep -Fqx 'UCI 2.6 CONSTRAINED BINARY INVENTORY: PASSED' <<<"$output"
          grep -Fqx 'UCI 2.5 CONSTRAINED BINARY MESSAGE IMPACT: PASSED' <<<"$output"
          grep -Fqx 'UCI 2.6 CONSTRAINED BINARY MESSAGE IMPACT: PASSED' <<<"$output"
          grep -qE '^test result: ok\. 3 passed' <<<"$output"
      # Task 054: effective member-identifier inventory, whole-schema first
      # blockers after remapping, and the real category-A generate + compile.
      - name: Real UCI member identifier inventory (Task 054, must execute)
        env:
          AMS_GRA_REQUIRE_GNAT: "1"
        run: |
          set -euo pipefail
          status=0
          output="$(cargo test --release -p ams-gra-codegen-oms --test uci_member_names -- \
            --nocapture --test-threads 1 2>&1)" || status=$?
          printf '%s\n' "$output"
          if (( status != 0 )); then exit "$status"; fi
          grep -Fqx 'UCI 2.5 MEMBER IDENTIFIER INVENTORY: PASSED' <<<"$output"
          grep -Fqx 'UCI 2.6 MEMBER IDENTIFIER INVENTORY: PASSED' <<<"$output"
          grep -Fqx 'UCI 2.5 WHOLE-SCHEMA FIRST BLOCKER PROBE: PASSED' <<<"$output"
          grep -Fqx 'UCI 2.6 WHOLE-SCHEMA FIRST BLOCKER PROBE: PASSED' <<<"$output"
          # This test prints only its marker, so under --nocapture with one
          # thread it lands on libtest's unterminated "test <name> ... " line.
          grep -Eqx '(test task054_real_uci_category_a_selection_generates_and_compiles \.\.\. )?UCI 2\.5 REAL CATEGORY-A MEMBER REMAPPING: PASSED' <<<"$output"
          grep -qE '^test result: ok\. 4 passed' <<<"$output"
      # Task 056: readiness accounts for generated-support declarations.
      # Task 060 closes the remaining OrderOfBattle support blockers in every
      # backend/release; the historical Task 054 category-A set
      # keeps readiness == generation. Both tests print other lines first, so
      # their markers are always on their own whole lines.
      - name: Real UCI generated-support readiness parity (Task 056, must execute)
        run: |
          set -euo pipefail
          status=0
          output="$(cargo test --release -p ams-gra-codegen-oms --test uci_generated_support task056_real_uci -- \
            --nocapture --test-threads 1 2>&1)" || status=$?
          printf '%s\n' "$output"
          if (( status != 0 )); then exit "$status"; fi
          grep -Fqx 'UCI 2.5 ORDEROFBATTLE GENERATED SUPPORT PARITY: PASSED' <<<"$output"
          grep -Fqx 'UCI 2.6 ORDEROFBATTLE GENERATED SUPPORT PARITY: PASSED' <<<"$output"
          grep -Fqx 'UCI 2.5 CATEGORY-A GENERATED SUPPORT PARITY: PASSED' <<<"$output"
          grep -qE '^test result: ok\. 2 passed' <<<"$output"
      - name: Real UCI generated-support plan binding (Task 064, must execute)
        run: |
          set -euo pipefail
          name=task064_real_uci_generated_support_binding
          status=0
          listing="$(cargo test --release -p ams-gra-codegen-oms --test uci_generated_support -- --list 2>&1)" || status=$?
          printf '%s\n' "$listing"
          if (( status != 0 )); then exit "$status"; fi
          grep -Fqx "$name: test" <<<"$listing"
          status=0
          output="$(cargo test --release -p ams-gra-codegen-oms --test uci_generated_support "$name" -- \
            --exact --nocapture --test-threads 1 2>&1)" || status=$?
          printf '%s\n' "$output"
          if (( status != 0 )); then exit "$status"; fi
          grep -qE '^test result: ok\. 1 passed' <<<"$output"
          grep -Fqx 'UCI 2.5 GENERATED SUPPORT BINDING: PASSED' <<<"$output"
          grep -Fqx 'UCI 2.6 GENERATED SUPPORT BINDING: PASSED' <<<"$output"
      # Task 057: fresh XML Schema duration inventory (named + direct, every
      # shape zero-facet), every Duration surface renderable in all three
      # backends, the real message-impact classification, and the smallest
      # real category-A service (`Log`) generating and compiling in Ada, Rust
      # and C++. The inventory/impact tests print a detail row before their
      # markers; the category-A test prints its marker FIRST, so it may share
      # libtest's unterminated "test <name> ... " line (as Task 054's does).
      - name: Real UCI duration inventory and message impact (Task 057, must execute)
        run: |
          set -euo pipefail
          status=0
          output="$(cargo test --release -p ams-gra-codegen-oms --test uci_duration -- \
            --nocapture --test-threads 1 2>&1)" || status=$?
          printf '%s\n' "$output"
          if (( status != 0 )); then exit "$status"; fi
          grep -Fqx 'UCI 2.5 DURATION INVENTORY: PASSED' <<<"$output"
          grep -Fqx 'UCI 2.6 DURATION INVENTORY: PASSED' <<<"$output"
          grep -Fqx 'UCI 2.5 DURATION MESSAGE IMPACT: RECORDED' <<<"$output"
