  # The runtime crates declare rust-version = "1.95". Fast CI checks them at
  # 1.95.0 on synthetic fixtures only; this job adds the generated REAL UCI 2.5
  # PositionReport and SubsystemStream codecs (build.rs generates them only
  # when AMS_GRA_UCI_2_5_ROOT is set) under 1.95.0. Rust only: no GNAT.
  msrv-real-uci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify Deep CI source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$actual" = "$GITHUB_SHA"
          test -n "$tree"
          printf 'DEEP_CI_SOURCE_SHA=%s\n' "$actual"
          printf 'DEEP_CI_SOURCE_TREE=%s\n' "$tree"
          printf 'DEEP_CI_EVENT=%s\n' "$GITHUB_EVENT_NAME"
      - name: Install Rust 1.95.0
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 --version
      - name: Fetch pinned UCI 2.5 (once)
        run: |
          set -euo pipefail
          UCI25="$(scripts/fetch-pinned-uci-2.5.sh "$RUNNER_TEMP/uci-2.5")"
          echo "AMS_GRA_UCI_2_5_ROOT=$UCI25" >> "$GITHUB_ENV"
      - name: Real-UCI generated code MSRV (1.95.0)
        run: |
          set -euo pipefail
          test -n "$AMS_GRA_UCI_2_5_ROOT"
          cargo +1.95.0 check --locked -p ams-gra-oms-runtime-rust-facade-tests --all-targets

  # Tasks 049-053: the generated facade and codecs against the UNMODIFIED
  # Sleet server at the exact pinned revision (built by the script from a fresh
  # checkout with Sleet's own pinned toolchain), plus the real UCI 2.5
  # PositionReport / SubsystemStream codecs. Rust only: no GNAT.
  real-sleet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify Deep CI source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$actual" = "$GITHUB_SHA"
          test -n "$tree"
          printf 'DEEP_CI_SOURCE_SHA=%s\n' "$actual"
          printf 'DEEP_CI_SOURCE_TREE=%s\n' "$tree"
          printf 'DEEP_CI_EVENT=%s\n' "$GITHUB_EVENT_NAME"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.13
      - name: Install pinned Python LA-CAL runtime
        run: |
          python3.11 -m pip install ./python/oms-lacal-runtime
          python3.13 -m pip install ./python/oms-lacal-runtime
      - name: Fetch pinned UCI 2.5 (once)
        run: |
          set -euo pipefail
          UCI25="$(scripts/fetch-pinned-uci-2.5.sh "$RUNNER_TEMP/uci-2.5")"
          echo "AMS_GRA_UCI_2_5_ROOT=$UCI25" >> "$GITHUB_ENV"
      - name: Real UCI 2.5 codecs (Tasks 050/052, must execute)
        run: |
          set -euo pipefail
          # Task 050: the REAL UCI 2.5 PositionReport codec.
          output="$(cargo test -p ams-gra-oms-runtime-rust-facade-tests --test real_uci_position_report -- \
            --exact real::task050_real_position_report_decodes_and_re_encodes --nocapture 2>&1)"
          printf '%s\n' "$output"
          grep -Fqx 'REAL POSITIONREPORT CODEC: PASSED' <<<"$output"
          grep -qE '^test result: ok\. 1 passed' <<<"$output"
          # Task 052: the REAL UCI 2.5 SubsystemStream hexBinary codec.
          output="$(cargo test -p ams-gra-oms-runtime-rust-facade-tests --test real_uci_subsystem_stream -- \
            --exact real::task052_real_subsystem_stream_hex_binary_round_trips --nocapture 2>&1)"
          printf '%s\n' "$output"
          grep -Fqx 'REAL SUBSYSTEMSTREAM HEXBINARY CODEC: PASSED' <<<"$output"
          grep -qE '^test result: ok\. 1 passed' <<<"$output"
          # Task 058: the REAL UCI 2.5 AMTI_SettingsCommand codec (the
          # zero-length bounded-ASCII EmptyType through the generated model).
          output="$(cargo test -p ams-gra-oms-runtime-rust-facade-tests --test real_uci_amti_settings -- \
            --exact real::task058_real_amti_settings_empty_type_round_trips --nocapture 2>&1)"
          printf '%s\n' "$output"
          grep -Fqx 'REAL AMTI_SETTINGSCOMMAND EMPTYTYPE CODEC: PASSED' <<<"$output"
          grep -qE '^test result: ok\. 1 passed' <<<"$output"
          # Task 059: real FileMetadata's FileNameType through the generated
          # Rust codec; invalid lexical text must fail checked construction.
          output="$(cargo test -p ams-gra-oms-runtime-rust-facade-tests --test real_uci_file_metadata -- \
            --exact real::task059_real_file_metadata_structured_ascii_codec --nocapture 2>&1)"
          printf '%s\n' "$output"
          grep -Fqx 'REAL FILEMETADATA STRUCTURED ASCII CODEC: PASSED' <<<"$output"
          grep -qE '^test result: ok\. 1 passed' <<<"$output"
      # AMS_GRA_UCI_2_5_ROOT (from GITHUB_ENV) also enables the script's real
      # PositionReport / SubsystemStream round trips through Sleet.
      - name: Rust LA-CAL runtime against real pinned Sleet (e38f61d8)
        env:
          PY006_PYTHONS: python3.11 python3.13
        run: |
          set -euo pipefail
          test -n "$AMS_GRA_UCI_2_5_ROOT"
          scripts/run-real-sleet-test.sh

  ada-hexbinary-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify Deep CI source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$actual" = "$GITHUB_SHA"
          test -n "$tree"
          printf 'DEEP_CI_SOURCE_SHA=%s\n' "$actual"
          printf 'DEEP_CI_SOURCE_TREE=%s\n' "$tree"
          printf 'DEEP_CI_EVENT=%s\n' "$GITHUB_EVENT_NAME"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install verified Alire 2.1.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task093-tools"
          cd "$RUNNER_TEMP/task093-tools"
          curl --fail --location --retry 3 --output alire.zip \
            https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          echo '09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  alire.zip' | sha256sum --check --strict
          unzip -q alire.zip
          test "$(bin/alr --version)" = 'alr 2.1.1'
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Build production generator
        run: cargo build --locked -p ams-gra-codegen-oms
      - name: Qualify extracted pinned real Binary types and fields
        shell: bash
        run: |
          set -euo pipefail
          uci25="$(scripts/fetch-pinned-uci-2.5.sh "$RUNNER_TEMP/task093-uci25")"
          uci26="$(scripts/fetch-pinned-uci-2.6.sh "$RUNNER_TEMP/task093-uci26")"
          echo "TASK093_UCI25=$uci25" >> "$GITHUB_ENV"
          echo "TASK093_UCI26=$uci26" >> "$GITHUB_ENV"
          python3 scripts/check-task093-real.py --compiler 16 --version 2.5 --schema "$uci25" --scratch "$RUNNER_TEMP/task093-real25" --generator "$GITHUB_WORKSPACE/target/debug/ams-gra-codegen-oms"
          python3 scripts/check-task093-real.py --compiler 16 --version 2.6 --schema "$uci26" --scratch "$RUNNER_TEMP/task093-real26" --generator "$GITHUB_WORKSPACE/target/debug/ams-gra-codegen-oms"
          for version in 25 26; do
            root="$RUNNER_TEMP/task093-real$version"
            test -s "$root/sources.json"
            test -s "$root/provenance.json"
            for policy in normal Check Ignore; do
              test -s "$root/$policy-alire.lock"
              test -s "$root/$policy-build.command.json"
              grep -Fx 'TASK093_REAL_COMPLETE cases= 14' "$root/$policy-run.log"
            done
          done
      - name: Execute newly READY complete real Log services, all policies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-task093-log.py --compiler 16 --version 2.5 --schema "$TASK093_UCI25" --scratch "$RUNNER_TEMP/task093-log25" --generator "$GITHUB_WORKSPACE/target/debug/ams-gra-codegen-oms"
          python3 scripts/check-task093-log.py --compiler 16 --version 2.6 --schema "$TASK093_UCI26" --scratch "$RUNNER_TEMP/task093-log26" --generator "$GITHUB_WORKSPACE/target/debug/ams-gra-codegen-oms"
          for version in 25 26; do
            root="$RUNNER_TEMP/task093-log$version"
            test -s "$root/sources.json"
            test -s "$root/qualification.json"
            for policy in normal Check Ignore; do
              grep -Fx 'TASK093_LOG_COMPLETE checks= 29 rejections= 9' "$root/$policy-run.log"
            done
          done
      - name: Preserve real Binary qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task093-real-binary
          path: |
            ${{ runner.temp }}/task093-real25/**
            ${{ runner.temp }}/task093-real26/**
            ${{ runner.temp }}/task093-log25/**
            ${{ runner.temp }}/task093-log26/**
          if-no-files-found: error
