name: UCI Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'crates/schema-docs/**'
      - 'crates/xsd-frontend/**'
      - 'crates/ir/**'
      - 'crates/codegen-core/**'
      - 'crates/cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/build-uci-pages.sh'
      - 'scripts/validate-uci-pages.py'
      - 'scripts/test_validate_uci_pages.py'
      - 'site/**'
      - '.github/workflows/uci-pages.yml'

permissions:
  contents: read

concurrency:
  # Non-main dispatches must not cancel an in-flight production publication.
  group: ${{ github.ref == 'refs/heads/main' && 'uci-pages-publication' || format('uci-pages-non-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate archive and link checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build and validate both pinned releases
        run: scripts/build-uci-pages.sh "$RUNNER_TEMP/uci-pages"
      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/uci-pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy exact validated artifact
        id: deployment
        uses: actions/deploy-pages@v5
