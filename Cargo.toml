[workspace]
resolver = "2"
members = [
    "crates/ir",
    "crates/xsd-frontend",
    "crates/codegen-core",
    "crates/backend-ada",
    "crates/backend-rust",
    "crates/backend-cpp",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/OWNER/ams-gra-codegen-oms"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
