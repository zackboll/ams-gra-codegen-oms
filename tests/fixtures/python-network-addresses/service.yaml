contract_version: "0.1"
service:
  name: Python Network Addresses
  version: "0.17.0"
  kind: service
standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"
functions:
  - id: loop
    name: Network Loop
    category: specific
    applicability: applicable
    exchanges:
      - id: input
        kind: oms_message
        direction: input
        mandate: mandatory
        message: NetworkNotice
        topic: network.loop
        timing: {kind: asynchronous}
      - id: output
        kind: oms_message
        direction: output
        mandate: mandatory
        message: NetworkNotice
        topic: network.loop
        timing: {kind: asynchronous}