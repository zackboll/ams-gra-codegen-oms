contract_version: "0.1"
service:
  name: Python Inherited Records
  version: "0.7.0"
  kind: service
standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"
functions:
  - id: loop
    name: Inherited Loop
    category: specific
    applicability: applicable
    exchanges:
      - id: input
        kind: oms_message
        direction: input
        mandate: mandatory
        message: InheritedNotice
        topic: inherited.loop
        timing: {kind: asynchronous}
      - id: output
        kind: oms_message
        direction: output
        mandate: mandatory
        message: InheritedNotice
        topic: inherited.loop
        timing: {kind: asynchronous}
      - id: sibling
        kind: oms_message
        direction: output
        mandate: optional
        message: SiblingNotice
        topic: inherited.sibling
        timing: {kind: asynchronous}