contract_version: "0.1"
service:
  name: Python Choice
  version: "0.15.0"
  kind: service
standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"
functions:
  - id: loop
    name: Choice Loop
    category: specific
    applicability: applicable
    exchanges:
      - id: input
        kind: oms_message
        direction: input
        mandate: mandatory
        message: ChoiceNotice
        topic: choice.loop
        timing: {kind: asynchronous}
      - id: output
        kind: oms_message
        direction: output
        mandate: mandatory
        message: ChoiceNotice
        topic: choice.loop
        timing: {kind: asynchronous}