# Authentic UCI 2.5 heterogeneous service; all exchanges share one LA-CAL session.
contract_version: "0.1"
service:
  name: task106-multimessage
  version: "0.1.0"
  kind: service
standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"
functions:
  - id: log
    name: Log qualification
    category: specific
    applicability: applicable
    exchanges:
      - id: receive
        kind: oms_message
        direction: input
        mandate: mandatory
        message: Log
        topic: task106-log
        timing:
          kind: asynchronous
      - id: publish
        kind: oms_message
        direction: output
        mandate: mandatory
        message: Log
        topic: task106-log
        timing:
          kind: asynchronous
  - id: rdma
    name: RDMA qualification
    category: specific
    applicability: applicable
    exchanges:
      - id: receive
        kind: oms_message
        direction: input
        mandate: mandatory
        message: RDMA_InitializeSetup
        topic: task106-rdma
        timing:
          kind: asynchronous
      - id: publish
        kind: oms_message
        direction: output
        mandate: mandatory
        message: RDMA_InitializeSetup
        topic: task106-rdma
        timing:
          kind: asynchronous
  - id: survivability
    name: Survivability qualification
    category: specific
    applicability: applicable
    exchanges:
      - id: receive
        kind: oms_message
        direction: input
        mandate: mandatory
        message: SurvivabilityRiskLevel
        topic: task106-survivability
        timing:
          kind: asynchronous
      - id: publish
        kind: oms_message
        direction: output
        mandate: mandatory
        message: SurvivabilityRiskLevel
        topic: task106-survivability
        timing:
          kind: asynchronous