# SYNTHETIC Task 054 negative fixture. Authored for this repository only.
#
# Selects InheritedClashNotice from member-collision.xsd: a post-remap member-name
# collision, which every backend must reject before generating output.
contract_version: "0.1"

service:
  name: member-collision-inherited-clash
  version: "0.1.0"
  kind: service

standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"

functions:
  - id: clash
    name: Clash
    category: specific
    applicability: applicable
    exchanges:
      - id: output-clash
        kind: oms_message
        direction: output
        mandate: mandatory
        message: InheritedClashNotice
        topic: clash-topic
        timing:
          kind: asynchronous
