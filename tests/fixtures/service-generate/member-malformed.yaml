# SYNTHETIC Task 054 negative fixture. Authored for this repository only.
#
# Selects MalformedNotice from member-malformed.xsd: member names whose
# ordinary identifiers are syntactically invalid (not keywords). Task 054
# must NOT sanitize them: every backend rejects them before output.
contract_version: "0.1"

service:
  name: member-malformed
  version: "0.1.0"
  kind: service

standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"

functions:
  - id: clash
    name: Clash
    category: specific
    applicability: applicable
    exchanges:
      - id: output-clash
        kind: oms_message
        direction: output
        mandate: mandatory
        message: MalformedNotice
        topic: clash-topic
        timing:
          kind: asynchronous
