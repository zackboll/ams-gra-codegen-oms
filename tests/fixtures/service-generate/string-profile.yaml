# SYNTHETIC Task 037 fixture. Authored for this repository only.
#
# Selects one message whose closure carries the supported named schema-version
# String profile in a required AND an optional named position. Before Task 037
# this was NOT READY for every backend; after it, all three must report READY
# and generate compilable output -- and, for Ada, the selected generation must
# include the `.adb` body.
#
# The schema also declares an unsupported constrained String type OUTSIDE this
# selection, which must therefore neither be projected nor block readiness.
contract_version: "0.1"

service:
  name: Version Negotiation
  version: "0.1.0"
  kind: service
  description: Synthetic contract selecting a schema-version String closure.

standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"

functions:
  - id: negotiation
    name: Negotiation
    category: specific
    applicability: applicable
    exchanges:
      - id: version-input
        kind: oms_message
        direction: input
        mandate: mandatory
        message: VersionReport
        topic: version.report
        timing:
          kind: asynchronous
