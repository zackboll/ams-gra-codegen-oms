# SYNTHETIC Task 058 fixture. Authored for this repository only.
#
# Selects StructuredNotice from codec-structured-ascii.xsd as one input and one
# output exchange on the same topic, so a CAL server routes the service's own
# StructuredNotice back to it. Every selected constrained String is a pinned
# bounded-ASCII row: model READY and --with-codec codec READY.
contract_version: "0.1"

service:
  name: codec-structured-ascii
  version: "0.1.0"
  kind: service

standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"

functions:
  - id: tail
    name: Tail
    category: specific
    applicability: applicable
    exchanges:
      - id: input-tail
        kind: oms_message
        direction: input
        mandate: mandatory
        message: StructuredNotice
        topic: structured-topic
        timing:
          kind: asynchronous
      - id: output-tail
        kind: oms_message
        direction: output
        mandate: mandatory
        message: StructuredNotice
        topic: structured-topic
        timing:
          kind: asynchronous
