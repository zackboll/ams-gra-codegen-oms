# SYNTHETIC Task 057 fixture. Authored for this repository only.
#
# Selects DurationNotice from codec-duration.xsd as one input and one output
# exchange on the same topic, so a CAL server routes the service's own
# DurationNotice back to it. Every selected Duration is unconstrained
# xs:duration: model READY and --with-codec codec READY.
contract_version: "0.1"

service:
  name: codec-duration
  version: "0.1.0"
  kind: service

standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"

functions:
  - id: span
    name: Span
    category: specific
    applicability: applicable
    exchanges:
      - id: input-span
        kind: oms_message
        direction: input
        mandate: mandatory
        message: DurationNotice
        topic: span-topic
        timing:
          kind: asynchronous
      - id: output-span
        kind: oms_message
        direction: output
        mandate: mandatory
        message: DurationNotice
        topic: span-topic
        timing:
          kind: asynchronous
