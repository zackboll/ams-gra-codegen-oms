contract_version: "0.1"
service:
  name: codec-patterned-integral
  version: "0.1.0"
  kind: service
standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"
functions:
  - id: serial
    name: Serial
    category: specific
    applicability: applicable
    exchanges:
      - id: input-serial
        kind: oms_message
        direction: input
        mandate: mandatory
        message: SerialNotice
        topic: serial-topic
        timing:
          kind: asynchronous
      - id: output-serial
        kind: oms_message
        direction: output
        mandate: mandatory
        message: SerialNotice
        topic: serial-topic
        timing:
          kind: asynchronous