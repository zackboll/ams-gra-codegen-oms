contract_version: "0.1"

service:
  name: Optional Primitive Sensor
  version: "0.1.0"
  kind: service
  description: Synthetic contract selecting an optional-direct-primitive closure.

standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"

functions:
  - id: sensor
    name: Sensor
    category: specific
    applicability: applicable
    exchanges:
