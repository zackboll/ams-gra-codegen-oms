# SYNTHETIC Task 050 TEST-ONLY contract. Authored for this repository only;
# it is NOT the upstream portable contract (upstream-minimal.yaml is left
# unchanged). It selects the REAL UCI 2.5 global PositionReport twice -- one
# input and one output exchange on the same OWP-legal topic -- so the
# unmodified pinned Sleet server routes the service's own PositionReport
# back to it. Used only by the real-UCI PositionReport Sleet integration.
contract_version: "0.1"

service:
  name: position-report-loop
  version: "0.1.0"
  kind: service

standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"

functions:
  - id: loop
    name: Loop
    category: specific
    applicability: applicable
    exchanges:
      - id: input-position
        kind: oms_message
        direction: input
        mandate: mandatory
        message: PositionReport
        topic: mission.position-report
        timing:
          kind: asynchronous
      - id: output-position
        kind: oms_message
        direction: output
        mandate: mandatory
        message: PositionReport
        topic: mission.position-report
        timing:
          kind: asynchronous
