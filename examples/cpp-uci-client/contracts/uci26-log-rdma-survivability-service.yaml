# CPP-OMS-010: receive-only contract for pinned UCI 2.6.
contract_version: "0.1"
service:
  name: cpp-uci-client-log-rdma-survivability
  version: "0.1.0"
  kind: service
standards:
  oms_version: "2.5"
  uci_schema_version: "2.6"
functions:
  - id: log
    name: Log
    category: specific
    applicability: applicable
    exchanges:
      - id: receive
        kind: oms_message
        direction: input
        mandate: mandatory
        message: Log
        topic: uci.log
        timing:
          kind: asynchronous
  - id: rdma
    name: RDMA Initialize Setup
    category: specific
    applicability: applicable
    exchanges:
      - id: receive
        kind: oms_message
        direction: input
        mandate: mandatory
        message: RDMA_InitializeSetup
        topic: uci.rdma
        timing:
          kind: asynchronous
  - id: survivability
    name: Survivability Risk Level
    category: specific
    applicability: applicable
    exchanges:
      - id: receive
        kind: oms_message
        direction: input
        mandate: mandatory
        message: SurvivabilityRiskLevel
        topic: uci.survivability
        timing:
          kind: asynchronous