# Authentic UCI 2.5 four-message service; all exchanges share one LA-CAL session.
contract_version: "0.1"
service:
  name: rust-uci-client
  version: "0.1.0"
  kind: service
standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"
functions:
  - id: log
    name: Log
    category: specific
    applicability: applicable
    exchanges:
      - id: receive
        kind: oms_message
        direction: input
        mandate: mandatory
        message: Log
        topic: rust-oms-003-log
        timing:
          kind: asynchronous
      - id: publish
        kind: oms_message
        direction: output
        mandate: mandatory
        message: Log
        topic: rust-oms-003-log
        timing:
          kind: asynchronous
  - id: rdma
    name: RDMA
    category: specific
    applicability: applicable
    exchanges:
      - id: receive
        kind: oms_message
        direction: input
        mandate: mandatory
        message: RDMA_InitializeSetup
        topic: rust-oms-003-rdma
        timing:
          kind: asynchronous
      - id: publish
        kind: oms_message
        direction: output
        mandate: mandatory
        message: RDMA_InitializeSetup
        topic: rust-oms-003-rdma
        timing:
          kind: asynchronous
  - id: survivability
    name: Survivability
    category: specific
    applicability: applicable
    exchanges:
      - id: receive
        kind: oms_message
        direction: input
        mandate: mandatory
        message: SurvivabilityRiskLevel
        topic: rust-oms-004-survivability
        timing:
          kind: asynchronous
      - id: publish
        kind: oms_message
        direction: output
        mandate: mandatory
        message: SurvivabilityRiskLevel
        topic: rust-oms-004-survivability
        timing:
          kind: asynchronous
  - id: dlz
    name: DLZ
    category: specific
    applicability: applicable
    exchanges:
      - id: receive
        kind: oms_message
        direction: input
        mandate: mandatory
        message: DLZ
        topic: task098-dlz
        timing:
          kind: asynchronous
      - id: publish
        kind: oms_message
        direction: output
        mandate: mandatory
        message: DLZ
        topic: task098-dlz
        timing:
          kind: asynchronous