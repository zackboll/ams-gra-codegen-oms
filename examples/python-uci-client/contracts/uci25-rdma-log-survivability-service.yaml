# Authentic UCI 2.5 receive-only RDMA + Log + SurvivabilityRiskLevel service
# (PY-OMS-022, --with-log --with-survivability). The RDMA and Log functions are
# identical to uci25-rdma-log-service.yaml; the Survivability function uses the
# same global message as tests/fixtures/task104/uci25-service.yaml.
contract_version: "0.1"
service:
  name: python-uci-client
  version: "0.1.0"
  kind: service
standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"
functions:
  - id: rdma
    name: RDMA setup reception
    category: specific
    applicability: applicable
    exchanges:
      - id: receive
        kind: oms_message
        direction: input
        mandate: mandatory
        message: RDMA_InitializeSetup
        topic: uci.rdma
        timing:
          kind: asynchronous
  - id: log
    name: Log reception
    category: specific
    applicability: applicable
    exchanges:
      - id: receive
        kind: oms_message
        direction: input
        mandate: mandatory
        message: Log
        topic: uci.log
        timing:
          kind: asynchronous
  - id: survivability
    name: Survivability risk level reception
    category: specific
    applicability: applicable
    exchanges:
      - id: receive
        kind: oms_message
        direction: input
        mandate: mandatory
        message: SurvivabilityRiskLevel
        topic: uci.survivability
        timing:
          kind: asynchronous
