[package]
name = "ams-gra-oms-runtime-rust"
description = "Reference Rust LA-CAL runtime adapter for generated OMS service APIs, backed by sleet-client"
version.workspace = true
edition.workspace = true
license.workspace = true
# The pinned sleet-client is edition 2024 and uses let-chains; Sleet itself
# pins toolchain 1.95.0 at the revision below, so that is the evidenced floor.
rust-version = "1.95"

[dependencies]
ams-gra-oms-runtime-api = { path = "../runtime-api-rust" }
# Task 049: the ONLY OWP/WebSocket implementation this runtime uses. Pinned to
# an exact public revision of open-arsenal/ams-gra-hello-world-sk-infra-sleet
# (workspace member `sleet-client`, version 0.1.0). Never copy or fork it; do
# not depend on the `sleet` server crate or its internals.
sleet-client = { git = "https://github.com/open-arsenal/ams-gra-hello-world-sk-infra-sleet", rev = "e38f61d8ce0d75c8508434a52f2ed77c69cf6a3b" }
serde_json = "1"
serde = "=1.0.229"
# One current-thread runtime on one background worker thread per connection.
tokio = { version = "1", features = ["rt", "sync", "macros", "net", "time"] }
# Feature-unify the pinned client's transport; all connection I/O stays in Sleet.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
# tokio-tungstenite leaves the rustls provider unselected. Choose exactly one
# through features, not application TLS code or a custom connector/verifier.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
# Test-only OWP peer for the worker fairness regression (the same versions
# sleet-client already pulls in; nothing new enters the lock file).
futures-util = "0.3"

[lints]
workspace = true
